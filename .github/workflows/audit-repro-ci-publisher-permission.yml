name: Reproduce test publisher permission failure

on:
  push:
    branches:
      - audit/contributor-tooling-repros-20260814

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Create a JUnit result
        run: |
          set -euo pipefail
          mkdir -p artifacts
          printf '%s\n' '<testsuite name="permission-reproduction" tests="1" failures="0"><testcase name="pass"/></testsuite>' > artifacts/result.xml

      - name: Publish with the workflow token
        id: publish
        continue-on-error: true
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: artifacts/**/*.xml
          comment_mode: always
          action_fail: true
          action_fail_on_inconclusive: true

      - name: Probe check-run permission directly
        id: check-run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/check-run-response.json"
          set +e
          status=$(curl -sS -o "$response" -w '%{http_code}' \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/check-runs" \
            -d "{\"name\":\"permission-reproduction\",\"head_sha\":\"${GITHUB_SHA}\",\"status\":\"completed\",\"conclusion\":\"failure\"}")
          set -e
          echo "check-run HTTP status: $status"
          sed -n '1,80p' "$response"
          echo "check-run HTTP status: $status" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$status" == "403" ]]; then
            echo 'The token cannot create a check run with this permission set.' >> "$GITHUB_STEP_SUMMARY"
            echo 'REPRODUCED: check-run creation is denied.'
            exit 1
          fi
          if [[ "$status" == "201" ]]; then
            echo 'NOT REPRODUCED: check-run creation succeeded.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo 'UNEXPECTED: the permission probe returned a different status.' >> "$GITHUB_STEP_SUMMARY"
          exit 2
