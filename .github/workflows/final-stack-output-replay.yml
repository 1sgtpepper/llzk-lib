name: LLZK final stack output replay

on:
  push:
    branches:
      - validation/final-stack-output-e7b6de69-20260810

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    env:
      OUTPUT_PATH: /tmp/llzk-final-stack-output

    steps:
      - name: Check out candidate
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@d1ca217b388ee87b2507a9a93bf01368bde7cec2
        with:
          install_url: https://releases.nixos.org/nix/nix-2.23.3/install
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Git credentials
        run: |
          git config --global 'url.https://api@github.com/'.insteadOf 'https://github.com/'
          git config --global 'url.https://ssh@github.com/'.insteadOf 'ssh://git@github.com/'
          git config --global 'url.https://git@github.com/'.insteadOf 'git@github.com:'

      - name: Use project build cache
        uses: cachix/cachix-action@v17
        with:
          name: veridise-public
          skipPush: true

      - name: Capture exact-head generated output
        shell: bash
        run: |
          set -euo pipefail
          nix build --impure --print-build-logs --expr \
            'let flake = builtins.getFlake (toString ./.) ; in flake.packages.x86_64-linux.debugGCC.overrideAttrs (_: { doCheck = false; })'

          llzk_opt="$PWD/result/bin/llzk-opt"
          test -x "$llzk_opt"
          mkdir -p "$OUTPUT_PATH"
          "$llzk_opt" --version > "$OUTPUT_PATH/llzk-opt.version"
          git rev-parse HEAD > "$OUTPUT_PATH/head.txt"

          clean_source() {
            local test_file="$1"
            local clean_file="$2"
            python3 - "$test_file" "$clean_file" <<'PY'
          from pathlib import Path
          import sys

          source = Path(sys.argv[1]).read_text()
          clean_lines = [
              line
              for line in source.splitlines()
              if not line.startswith("// CHECK")
              and not line.startswith("// NOTE: Assertions have been autogenerated")
          ]
          Path(sys.argv[2]).write_text("\n".join(clean_lines).strip() + "\n")
          PY
          }

          capture_success() {
            local name="$1"
            local test_file="$2"
            shift 2
            local output_dir="$OUTPUT_PATH/$name"
            local clean_file="$RUNNER_TEMP/$name-clean.llzk"
            mkdir -p "$output_dir"
            clean_source "$test_file" "$clean_file"
            cp "$test_file" "$output_dir/source.llzk"
            set +e
            "$llzk_opt" "$@" "$clean_file" > "$output_dir/producer-output.llzk" 2>&1
            local status=$?
            set -e
            echo "$status" > "$output_dir/status.txt"
            if [[ "$status" -ne 0 ]]; then
              return
            fi
            python3 - "$output_dir/producer-output.llzk" "$output_dir" <<'PY'
          from pathlib import Path
          import subprocess
          import sys

          producer = Path(sys.argv[1]).read_text()
          output_dir = Path(sys.argv[2])
          generator = Path.cwd() / "scripts/generate-test-checks.py"
          for index, chunk in enumerate(producer.split("// -----")):
              raw = chunk.strip() + "\n"
              (output_dir / f"output-{index:02d}.llzk").write_text(raw)
              generated = subprocess.run(
                  ["python3", str(generator)],
                  input=raw,
                  text=True,
                  check=True,
                  capture_output=True,
              ).stdout
              (output_dir / f"generated-checks-{index:02d}.txt").write_text(generated)
          PY
          }

          capture_raw() {
            local name="$1"
            local test_file="$2"
            shift 2
            local output_dir="$OUTPUT_PATH/$name"
            local clean_file="$RUNNER_TEMP/$name-clean.llzk"
            mkdir -p "$output_dir"
            clean_source "$test_file" "$clean_file"
            cp "$test_file" "$output_dir/source.llzk"
            set +e
            "$llzk_opt" "$@" "$clean_file" > "$output_dir/producer-output.txt" 2>&1
            local status=$?
            set -e
            echo "$status" > "$output_dir/status.txt"
          }

          capture_success pr635-struct-pass3 \
            test/Transforms/Flattening/instantiate_structs_pass_3.llzk \
            -split-input-file -llzk-flatten -verify-diagnostics
          capture_success pr635-felt \
            test/Transforms/Flattening/instantiate_expr_felt_typevar_completion.llzk \
            -split-input-file -llzk-flatten
          capture_success pr635-partial \
            test/Transforms/Flattening/instantiate_expr_partial.llzk \
            -split-input-file -llzk-flatten
          capture_success pr635-target-local \
            test/Transforms/Flattening/instantiate_expr_target_local.llzk \
            -split-input-file '--pass-pipeline=builtin.module(llzk-flatten{cleanup=disabled})'
          capture_success pr635-typevar \
            test/Transforms/Flattening/instantiate_expr_typevar_completion.llzk \
            -split-input-file -llzk-flatten
          capture_success pr635-normalized-felt \
            test/Transforms/Flattening/instantiate_func_felt_normalization.llzk \
            -split-input-file -llzk-flatten
          capture_success pr635-funcs-pass \
            test/Transforms/Flattening/instantiate_funcs_pass.llzk \
            -split-input-file -llzk-flatten
          capture_success pr635-nested-args \
            test/Transforms/Flattening/instantiate_nested_call_template_params.llzk \
            -llzk-flatten=cleanup=disabled
          capture_success pr637-order \
            test/Transforms/Flattening/instantiate_function_order.llzk \
            -split-input-file -llzk-flatten=cleanup=disabled
          capture_success pr637-reuse \
            test/Transforms/Flattening/instantiate_function_reuse.llzk \
            -split-input-file -llzk-flatten=cleanup=disabled
          capture_raw pr635-funcs-fail \
            test/Transforms/Flattening/instantiate_funcs_fail.llzk \
            -split-input-file -llzk-flatten -verify-diagnostics
          capture_raw pr635-rollback \
            test/Transforms/Flattening/instantiate_func_rollback.llzk \
            -llzk-flatten=cleanup=disabled -verify-diagnostics -mlir-print-ir-after-failure

      - name: Upload exact-head output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: final-stack-output-${{ github.sha }}
          path: /tmp/llzk-final-stack-output
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
