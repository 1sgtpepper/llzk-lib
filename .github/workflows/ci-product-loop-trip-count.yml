name: Product loop trip-count reproduction

on:
  push:
    branches:
      - repro/product-loop-trip-count
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: main
            commit: d1198631dbe9906cb149d1ddcd0dd1ca071dae6b
            fuse: --llzk-fuse-product-control-flow
          - name: release
            commit: b1b8d52ca4e6114cdd9a80417f96342a9f9e8b6c
            fuse: --llzk-fuse-product-loops
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout reproducer files
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: cachix/install-nix-action@d1ca217b388ee87b2507a9a93bf01368bde7cec2
        with:
          install_url: https://releases.nixos.org/nix/nix-2.23.3/install
          github_access_token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Set Git credentials
        run: |
          git config --global 'url.https://api@github.com/'.insteadOf 'https://github.com/'
          git config --global 'url.https://ssh@github.com/'.insteadOf 'ssh://git@github.com/'
          git config --global 'url.https://git@github.com/'.insteadOf 'git@github.com:'

      - uses: cachix/cachix-action@v17
        with:
          name: veridise-public
          authToken: '${{ secrets.CACHIX_PUBLIC_TOKEN }}'

      - name: Run exact-revision reproduction (${{ matrix.target.name }})
        env:
          SOURCE_COMMIT: ${{ matrix.target.commit }}
          FUSE_PASS: ${{ matrix.target.fuse }}
          SOURCE_NAME: ${{ matrix.target.name }}
          WORK: ${{ runner.temp }}/llzk-product-loop-trip-count
        run: |
          set -euo pipefail
          SOURCE="$RUNNER_TEMP/llzk-source"
          mkdir -p "$SOURCE" "$WORK"
          git rev-parse "$SOURCE_COMMIT^{commit}"
          git archive "$SOURCE_COMMIT" | tar -x -C "$SOURCE"
          cp test/Transforms/FuseProductControlFlow/unequal_step_trip_count.llzk "$WORK/candidate.llzk"
          cp .github/validation/unequal_step_trip_count_control.llzk "$WORK/control.llzk"
          cp .github/validation/empty_inputs.json "$WORK/empty_inputs.json"

          cd "$SOURCE"
          nix --print-build-logs build '.#debugGCC'
          BIN="$SOURCE/result/bin"

          grep -F 'arith.constant 4 : index' "$WORK/candidate.llzk"
          grep -F 'arith.constant 3 : index' "$WORK/control.llzk"

          "$BIN/llzk-opt" --verify-each \
            --llzk-compute-constrain-to-product="root-struct=Main" \
            "$FUSE_PASS" "$WORK/candidate.llzk" -o "$WORK/candidate.product.mlir"
          "$BIN/llzk-opt" --verify-each \
            --llzk-compute-constrain-to-product="root-struct=Main" \
            "$FUSE_PASS" "$WORK/control.llzk" -o "$WORK/control.product.mlir"

          "$BIN/llzk-opt" --verify-each \
            --llzk-compute-constrain-to-product="root-struct=Main" \
            "$WORK/candidate.llzk" -o "$WORK/candidate.unfused.product.mlir"

          awk '/function.def @product/{inside=1} inside{print} /function.def @compute/{exit}' \
            "$WORK/candidate.product.mlir" > "$WORK/candidate.product.function.mlir"
          awk '/function.def @product/{inside=1} inside{print} /function.def @compute/{exit}' \
            "$WORK/control.product.mlir" > "$WORK/control.product.function.mlir"
          awk '/function.def @product/{inside=1} inside{print} /function.def @compute/{exit}' \
            "$WORK/candidate.unfused.product.mlir" > "$WORK/candidate.unfused.product.function.mlir"

          grep -F 'product_source = "fused"' "$WORK/candidate.product.function.mlir"
          grep -F 'product_source = "fused"' "$WORK/control.product.function.mlir"
          grep -F 'struct.writem' "$WORK/candidate.product.function.mlir"
          grep -F 'constrain.eq' "$WORK/candidate.product.function.mlir"
          grep -F 'scf.for %arg0 = %c0_0 to %c3_1 step %c3_2' \
            "$WORK/candidate.product.function.mlir"

          "$BIN/llzk-witgen" "$WORK/candidate.llzk" --inputs "$WORK/empty_inputs.json" \
            > "$WORK/candidate.witgen.json"
          "$BIN/llzk-witgen" "$WORK/control.llzk" --inputs "$WORK/empty_inputs.json" \
            > "$WORK/control.witgen.json"
          "$BIN/llzk-witgen" "$WORK/candidate.llzk" --inputs "$WORK/empty_inputs.json" \
            --backend=execution-engine > "$WORK/candidate.witgen-jit.json"
          "$BIN/llzk-witgen" "$WORK/control.llzk" --inputs "$WORK/empty_inputs.json" \
            --backend=execution-engine > "$WORK/control.witgen-jit.json"
          grep -F '"out": "3"' "$WORK/candidate.witgen.json"
          grep -F '"out": "0"' "$WORK/control.witgen.json"
          grep -F '"out": "3"' "$WORK/candidate.witgen-jit.json"
          grep -F '"out": "0"' "$WORK/control.witgen-jit.json"

          "$BIN/llzk-opt" --verify-each --llzk-flatten \
            "$WORK/candidate.product.mlir" -o "$WORK/candidate.flattened.mlir"
          "$BIN/llzk-opt" --llzk-flatten \
            "$WORK/candidate.unfused.product.mlir" -o "$WORK/candidate.unfused.flattened.mlir"
          "$BIN/llzk-opt" --verify-each --llzk-flatten \
            "$WORK/control.product.mlir" -o "$WORK/control.flattened.mlir"
          awk '/function.def @product/{inside=1} inside{print} /function.def @compute/{exit}' \
            "$WORK/candidate.flattened.mlir" > "$WORK/candidate.flattened.product.function.mlir"
          awk '/function.def @product/{inside=1} inside{print} /function.def @compute/{exit}' \
            "$WORK/candidate.unfused.flattened.mlir" > "$WORK/candidate.unfused.flattened.product.function.mlir"
          test "$(awk '/struct\.writem.*\[@out\]/{n++} END{print n+0}' \
            "$WORK/candidate.unfused.flattened.product.function.mlir")" -eq 2
          test "$(awk '/struct\.writem.*\[@out\]/{n++} END{print n+0}' \
            "$WORK/candidate.flattened.product.function.mlir")" -eq 1
          grep -F 'cast.tofelt %c3 : index' \
            "$WORK/candidate.unfused.flattened.product.function.mlir"
          if grep -F 'cast.tofelt %c3 : index' \
            "$WORK/candidate.flattened.product.function.mlir"; then
            echo 'fused product still contains the compute loop second iteration' >&2
            exit 1
          fi

          if "$BIN/llzk-opt" --llzk-to-smt-no-cf='field=babybear' \
            "$WORK/candidate.flattened.mlir" -o "$WORK/candidate.smt.mlir" \
            2>"$WORK/candidate.smt.stderr"; then
            candidate_smt_status=0
          else
            candidate_smt_status=$?
          fi
          printf 'exit=%s bytes=%s\n' "$candidate_smt_status" \
            "$(wc -c < "$WORK/candidate.smt.mlir" 2>/dev/null || echo 0)" \
            > "$WORK/candidate.smt.status"
          if [ "$candidate_smt_status" -ne 0 ]; then
            cat "$WORK/candidate.smt.stderr" >&2
            exit 1
          fi
          if "$BIN/llzk-opt" --llzk-to-smt-no-cf='field=babybear' \
            "$WORK/control.flattened.mlir" -o "$WORK/control.smt.mlir" \
            2>"$WORK/control.smt.stderr"; then
            control_smt_status=0
          else
            control_smt_status=$?
          fi
          printf 'exit=%s bytes=%s\n' "$control_smt_status" \
            "$(wc -c < "$WORK/control.smt.mlir" 2>/dev/null || echo 0)" \
            > "$WORK/control.smt.status"
          if [ "$control_smt_status" -ne 0 ]; then
            cat "$WORK/control.smt.stderr" >&2
            exit 1
          fi
          grep -E '^exit=0 bytes=[1-9][0-9]*$' "$WORK/candidate.smt.status"
          grep -E '^exit=0 bytes=[1-9][0-9]*$' "$WORK/control.smt.status"
          test -s "$WORK/candidate.smt.mlir"
          test -s "$WORK/control.smt.mlir"

          grep -F 'func.func @smt_Main' "$WORK/candidate.smt.mlir"
          grep -F 'smt.assert' "$WORK/candidate.smt.mlir"
          grep -F 'smt.assert' "$WORK/control.smt.mlir"
          grep -F 'smt.eq %out_w' "$WORK/candidate.smt.mlir"
          grep -E 'smt.int.cmp le %out_w, %c3([[:space:]]|$)' \
            "$WORK/candidate.smt.mlir"
          grep -E 'smt.int.cmp le %out_w, %c0(_[0-9]+)?([[:space:]]|$)' \
            "$WORK/control.smt.mlir"
          {
            echo 'candidate public relation:'
            grep -E 'smt.int.cmp (ge|le) %out_w|smt.eq %out_w' \
              "$WORK/candidate.smt.mlir"
            echo 'control public relation:'
            grep -E 'smt.int.cmp (ge|le) %out_w|smt.eq %out_w' \
              "$WORK/control.smt.mlir"
          } > "$WORK/downstream-public-relation.txt"

          {
            echo 'source oracle: compute iterations are i=0,3; final @out is 3'
            echo 'unfused product oracle: compute side of product has two writes, @out=3 after flattening'
            echo 'fused-loop oracle: MLIR fusion uses the constraint loop bounds i=0; final @out is 0'
            echo 'control oracle: compute and constrain each execute only at i=0; final @out is 0'
          } > "$WORK/source-oracle.txt"

          sha256sum "$WORK"/* > "$WORK/artifact.sha256"

      - name: Upload reproduction artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: product-loop-trip-count-${{ matrix.target.name }}-${{ github.run_id }}
          path: ${{ runner.temp }}/llzk-product-loop-trip-count
