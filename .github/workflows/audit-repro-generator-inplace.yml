name: Reproduce generator missing inplace source

on:
  push:
    branches:
      - audit/contributor-tooling-repros-20260814

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use inplace mode without a source path
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/generator-inplace.log"
          set +e
          printf 'module {\n}\n' | python3 scripts/generate-test-checks.py --inplace > "$log" 2>&1
          status=$?
          set -e
          cat "$log"
          echo "script status: $status" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$status" -eq 1 ]] && grep -q 'TypeError' "$log"; then
            echo 'REPRODUCED: inplace mode without --source raises an uncaught TypeError.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [[ "$status" -eq 0 ]]; then
            echo 'NOT REPRODUCED: the invalid inplace invocation was handled cleanly.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo 'UNEXPECTED: a different failure occurred.' >> "$GITHUB_STEP_SUMMARY"
          exit 2
