name: Audit repro - generator in-place repeat

on:
  push:
    branches:
      - audit/contributor-tooling-repros-round2-20260814

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Run in-place generation twice
        shell: bash
        run: |
          set -euo pipefail
          tmp="${RUNNER_TEMP}/generate-repeat"
          mkdir -p "$tmp"
          printf '%s\n' \
            'module {' \
            '  func.func @main() {' \
            '  }' \
            '}' \
            > "$tmp/source.mlir"
          printf '%s\n' \
            'module {' \
            '}' \
            > "$tmp/input.mlir"
          python3 "$GITHUB_WORKSPACE/scripts/generate-test-checks.py" \
            --source "$tmp/source.mlir" --source_delim_regex='^module ' -i "$tmp/input.mlir"
          python3 "$GITHUB_WORKSPACE/scripts/generate-test-checks.py" \
            --source "$tmp/source.mlir" --source_delim_regex='^module ' -i "$tmp/input.mlir"
          note_count="$(grep -c 'NOTE: Assertions have been autogenerated' "$tmp/source.mlir" || true)"
          cat "$tmp/source.mlir"
          if [[ "$note_count" -le 1 ]]; then
            echo "The generated note was not duplicated."
            exit 0
          fi
          echo "REPRODUCED: repeated in-place generation leaves $note_count autogenerated notes."
          exit 1
