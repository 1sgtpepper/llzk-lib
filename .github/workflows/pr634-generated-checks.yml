name: Generated checks

on:
  push:
    branches:
      - ci/verify-pr634-output-20260825

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: 7bfd47140dd25f2e0ed18c33ac35a55e76d66323

      - uses: cachix/install-nix-action@d1ca217b388ee87b2507a9a93bf01368bde7cec2
        with:
          install_url: https://releases.nixos.org/nix/nix-2.23.3/install
          github_access_token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Set Git credentials
        run: |
          git config --global 'url.https://api@github.com/'.insteadOf 'https://github.com/'
          git config --global 'url.https://ssh@github.com/'.insteadOf 'ssh://git@github.com/'
          git config --global 'url.https://git@github.com/'.insteadOf 'git@github.com:'

      - uses: cachix/cachix-action@v17
        with:
          name: veridise-public

      - name: Build llzk-opt
        run: |
          nix build --impure --print-build-logs --expr \
            'let flake = builtins.getFlake (toString ./.) ; in flake.packages.x86_64-linux.debugGCC.overrideAttrs (_: { doCheck = false; })'

      - name: Generate complete check output
        run: |
          set -euo pipefail
          mkdir -p artifacts
          target_head=7bfd47140dd25f2e0ed18c33ac35a55e76d66323
          test "$(git rev-parse HEAD)" = "$target_head"
          filecheck=$(find /nix/store -type f -path '*/bin/FileCheck' -executable -print -quit)
          test -n "$filecheck"
          printf '%s\n' "$target_head" > artifacts/target-head.txt
          tests=(
            test/Dialect/Function/call_with_symbolic_felt_restriction_pass.llzk
            test/Dialect/Function/call_with_template_params_pass.llzk
            test/Dialect/Struct/struct_params_restrictions_pass.llzk
            test/Dialect/Struct/struct_params_symbolic_pass.llzk
            test/Dialect/Verif/contracts_pass.llzk
            test/Dialect/Verif/include_with_symbolic_felt_restriction_pass.llzk
          )
          for test in "${tests[@]}"; do
            stem="${test##*/}"
            stem="${stem%.llzk}"
            run_line=$(sed -n '1p' "$test")
            producer_pipeline=${run_line#*llzk-opt }
            producer_pipeline=${producer_pipeline%% %s*}
            producer_pipeline=${producer_pipeline//%input_dir/test}
            producer_pipeline=${producer_pipeline//\"/}
            read -r -a producer_args <<< "$producer_pipeline"
            printf 'result/bin/llzk-opt %s %s\n' "$producer_pipeline" "$test" \
              > "artifacts/${stem}.producer-command.txt"
            result/bin/llzk-opt "${producer_args[@]}" "$test" \
              > "artifacts/${stem}.raw.llzk" 2>&1
            scripts/generate-test-checks.py < "artifacts/${stem}.raw.llzk" > "artifacts/${stem}.checks.llzk"
            printf 'scripts/generate-test-checks.py < artifacts/%s.raw.llzk\n' "$stem" \
              > "artifacts/${stem}.generator-command.txt"
            cp "$test" "artifacts/${stem}.source.llzk"
          done

          # Generate every artifact before enforcing comparisons so one stale block cannot hide
          # the authoritative output for a later fixture.
          for test in "${tests[@]}"; do
            stem="${test##*/}"
            stem="${stem%.llzk}"
            run_line=$(sed -n '1p' "$test")
            python3 - "$test" "artifacts/${stem}.checks.llzk" \
                > "artifacts/${stem}.comparison.txt" <<'PY'
          import difflib
          import pathlib
          import re
          import sys

          source, generated = (pathlib.Path(arg) for arg in sys.argv[1:])

          def check_lines(path):
              return [
                  line.rstrip("\n")
                  for line in path.read_text().splitlines(keepends=True)
                  if line.startswith("// CHECK")
              ]

          def normalize(line):
              variable_names = normalize.variable_names

              def variable(match):
                  name = match.group(1)
                  if name not in variable_names:
                      variable_names[name] = f"VAR_{len(variable_names)}"
                  return f"[[{variable_names[name]}]]"

              line = re.sub(r'loc\("[^"]*"\)', 'loc("<location>")', line)
              line = re.sub(
                  r'^// CHECK(?:-(?:LABEL|NEXT|SAME|NOT|DAG|EMPTY))?:',
                  '// CHECK:',
                  line,
              )
              line = re.sub(r'^(// CHECK:) +', r'\1 ', line)
              line = re.sub(
                  r'\[\[([A-Za-z_][A-Za-z0-9_]*)(?::(.*?))?\]\]',
                  variable,
                  line,
              )
              return line

          normalize.variable_names = {}

          committed = [normalize(line) for line in check_lines(source)]
          normalize.variable_names = {}
          fresh = [normalize(line) for line in check_lines(generated)]
          committed = [line for line in committed if line != "// CHECK: // -----"]
          fresh = [line for line in fresh if line != "// CHECK: // -----"]
          if committed != fresh:
              print(f"CHECK block mismatch for {source}")
              print("".join(difflib.unified_diff(
                  [line + "\n" for line in committed],
                  [line + "\n" for line in fresh],
                  fromfile="committed",
                  tofile="fresh",
              )), end="")
              raise SystemExit(1)
          print(f"CHECK block matches fresh generator output for {source}")
          PY
            filecheck_pipeline=${run_line#*FileCheck }
            filecheck_pipeline=${filecheck_pipeline//%s/$test}
            read -r -a filecheck_args <<< "$filecheck_pipeline"
            printf '%s %s\n' "$filecheck" "$filecheck_pipeline" \
              > "artifacts/${stem}.filecheck-command.txt"
            "$filecheck" "${filecheck_args[@]}" \
              < "artifacts/${stem}.raw.llzk" \
              > "artifacts/${stem}.filecheck-output.txt" 2>&1
          done

      - name: Upload generated checks
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr634-generated-checks
          path: artifacts
