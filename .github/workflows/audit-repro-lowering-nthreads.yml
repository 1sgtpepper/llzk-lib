name: Reproduce lowering evaluator zero-worker failure

on:
  push:
    branches:
      - audit/contributor-tooling-repros-20260814

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run with zero workers
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/lowering-nthreads.log"
          set +e
          python3 scripts/lowering_pass_eval.py \
            --src-dir test/Inputs \
            --dest-dir "$RUNNER_TEMP/lowering-output" \
            --llzk-opt-bin /usr/bin/true \
            --nthreads 0 \
            --output-csv "$RUNNER_TEMP/lowering.csv" > "$log" 2>&1
          status=$?
          set -e
          cat "$log"
          echo "script status: $status" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$status" -eq 1 ]] && grep -q 'Number of processes must be at least 1' "$log"; then
            echo 'REPRODUCED: zero workers produce an uncaught multiprocessing traceback.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [[ "$status" -eq 0 ]]; then
            echo 'NOT REPRODUCED: zero workers were rejected cleanly or normalized.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo 'UNEXPECTED: a different failure occurred.' >> "$GITHUB_STEP_SUMMARY"
          exit 2
