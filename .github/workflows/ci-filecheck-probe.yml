name: FileCheck probe

on:
  push:
    branches:
      - ci/verify-pr484-filecheck-probe-20260809

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install FileCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-18-tools
      - name: Check exact generated location output
        run: |
          filecheck="$(find /usr/lib/llvm-* -type f -name FileCheck -executable -print -quit)"
          test -x "$filecheck"
          for count in $(seq 2 23); do
            head -n $((8 + count)) "$GITHUB_WORKSPACE/ci-probe-checks.txt" \
              > "$RUNNER_TEMP/truncated-checks.txt"
            if "$filecheck" --enable-var-scope "$RUNNER_TEMP/truncated-checks.txt" \
              < "$GITHUB_WORKSPACE/ci-probe-input.llzk" \
              > "$RUNNER_TEMP/filecheck.log" 2>&1; then
              echo "attribute_checks_through_$((count - 1))=PASS"
            else
              echo "attribute_checks_through_$((count - 1))=FAIL"
              cat "$RUNNER_TEMP/filecheck.log"
              break
            fi
          done
