name: LLZK repository validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository:
    name: PR ${{ matrix.target.pr }} - ${{ matrix.check.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        target:
          - pr: 484
            head: fceb364691faa33b0eeaa438845188be16c1cc85
        check:
          - name: GCC
            attr: .#debugGCC
            report: gcc-report.xml
          - name: Clang
            attr: .#debugClangCov
            report: clang-report.xml
          - name: debug-install
            attr: .#checks.x86_64-linux.llzk-installcheck-debug
            report: ''
          - name: release-install
            attr: .#checks.x86_64-linux.llzk-installcheck-release
            report: ''
          - name: docs
            attr: .#docs
            report: ''
    env:
      TARGET_HEAD: ${{ matrix.target.head }}
      BUILD_ATTR: ${{ matrix.check.attr }}
      CHECK_NAME: ${{ matrix.check.name }}
      TEST_REPORT: ${{ matrix.check.report }}
      NIX_CONFIG: |
        max-jobs = 1
        cores = 2
        experimental-features = nix-command flakes
        access-tokens = github.com=${{ github.token }}
    steps:
      - name: Check out published source
        uses: actions/checkout@v6
        with:
          repository: 1sgtpepper/llzk-lib
          ref: ${{ env.TARGET_HEAD }}
          persist-credentials: false
      - name: Record source identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/repository-evidence"
          git rev-parse HEAD | tee "$RUNNER_TEMP/repository-evidence/source-head.txt"
          test "$(git rev-parse HEAD)" = "$TARGET_HEAD"
          git status --porcelain > "$RUNNER_TEMP/repository-evidence/worktree-status.txt"
          test ! -s "$RUNNER_TEMP/repository-evidence/worktree-status.txt"
      - name: Install Nix
        uses: cachix/install-nix-action@d1ca217b388ee87b2507a9a93bf01368bde7cec2
        with:
          install_url: https://releases.nixos.org/nix/nix-2.23.3/install
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure source transport
        run: |
          git config --global 'url.https://api@github.com/'.insteadOf 'https://github.com/'
          git config --global 'url.https://ssh@github.com/'.insteadOf 'ssh://git@github.com/'
          git config --global 'url.https://git@github.com/'.insteadOf 'git@github.com:'
      - name: Use the project cache
        uses: cachix/cachix-action@v17
        with:
          name: veridise-public
          skipPush: true
      - name: Run repository check
        shell: bash
        run: |
          set -euo pipefail
          options=()
          if [[ "$CHECK_NAME" == docs ]]; then
            options+=(--option sandbox false)
          fi
          printf 'nix %s --print-build-logs build %s\n' "${options[*]}" "$BUILD_ATTR" > "$RUNNER_TEMP/repository-evidence/command.txt"
          set +e
          nix "${options[@]}" --print-build-logs build "$BUILD_ATTR" --out-link "$RUNNER_TEMP/validated-result" 2>&1 | tee "$RUNNER_TEMP/repository-evidence/build.log"
          build_status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$build_status" > "$RUNNER_TEMP/repository-evidence/exit-status.txt"
          test "$build_status" -eq 0
          readlink -f "$RUNNER_TEMP/validated-result" > "$RUNNER_TEMP/repository-evidence/store-path.txt"
          if [[ -n "$TEST_REPORT" ]]; then
            cp "$RUNNER_TEMP/validated-result/artifacts/$TEST_REPORT" "$RUNNER_TEMP/repository-evidence/report.xml"
            python3 - "$RUNNER_TEMP/repository-evidence/report.xml" <<'PYTHON'
          import sys
          import xml.etree.ElementTree as ET
          root = ET.parse(sys.argv[1]).getroot()
          cases = list(root.iter('testcase'))
          assert cases, 'repository test report is empty'
          assert not list(root.iter('failure')) and not list(root.iter('error')), 'repository tests failed'
          print(f'Repository test cases: {len(cases)}')
          PYTHON
          fi
      - name: Upload check evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: repository-pr${{ matrix.target.pr }}-${{ matrix.check.name }}-${{ matrix.target.head }}
          path: ${{ runner.temp }}/repository-evidence
          if-no-files-found: error
          retention-days: 30
