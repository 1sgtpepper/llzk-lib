name: LLZK PR 484 output capture

on:
  push:
    branches:
      - ci/verify-pr484-fusion-guards
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    env:
      TARGET_HEAD: 40dd084b612517146fafbd8146168ecdae0858f9
      OUTPUT_PATH: ${{ runner.temp }}/llzk-pr484-output

    steps:
      - name: Check out validation workflow
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@d1ca217b388ee87b2507a9a93bf01368bde7cec2
        with:
          install_url: https://releases.nixos.org/nix/nix-2.23.3/install
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Git credentials
        run: |
          git config --global 'url.https://api@github.com/'.insteadOf 'https://github.com/'
          git config --global 'url.https://ssh@github.com/'.insteadOf 'ssh://git@github.com/'
          git config --global 'url.https://git@github.com/'.insteadOf 'git@github.com:'

      - name: Use project build cache
        uses: cachix/cachix-action@v17
        with:
          name: veridise-public
          skipPush: true

      - name: Capture complete generated output
        shell: bash
        run: |
          set -euo pipefail
          tested_path="$RUNNER_TEMP/llzk-pr484"
          mkdir -p "$OUTPUT_PATH"

          git fetch --no-tags --filter=blob:none \
            https://github.com/1sgtpepper/llzk-lib.git "$TARGET_HEAD"
          git worktree add --detach "$tested_path" "$TARGET_HEAD"
          test "$(git -C "$tested_path" rev-parse HEAD)" = "$TARGET_HEAD"

          (
            cd "$tested_path"
            nix build --impure --print-build-logs --expr \
              'let flake = builtins.getFlake (toString ./.) ; in flake.packages.x86_64-linux.debugGCC.overrideAttrs (_: { doCheck = false; })'
          )

          llzk_opt="$tested_path/result/bin/llzk-opt"
          filecheck=$(find /nix/store -type f -path '*/bin/FileCheck' -executable -print -quit)
          test -x "$llzk_opt"
          test -n "$filecheck"
          "$llzk_opt" --version > "$OUTPUT_PATH/llzk-opt.version"
          printf '%s\n' "$TARGET_HEAD" > "$OUTPUT_PATH/target-head.txt"

          capture_transform() {
            name="$1"
            test_file="$2"
            shift 2
            output_path="$OUTPUT_PATH/$name"
            mkdir -p "$output_path"
            cp "$tested_path/$test_file" "$output_path/source.llzk"
            "$llzk_opt" "$@" "$tested_path/$test_file" \
              > "$output_path/producer-output.llzk" 2>&1
            python3 "$tested_path/scripts/generate-test-checks.py" \
              < "$output_path/producer-output.llzk" \
              > "$output_path/generated-checks.txt"
            "$filecheck" "$output_path/generated-checks.txt" \
              < "$output_path/producer-output.llzk"
            {
              echo "head=$TARGET_HEAD"
              echo "test=$test_file"
              echo "producer_command=result/bin/llzk-opt $* $test_file"
              echo "fresh_generated_checks_against_exact_head_output=PASS"
            } > "$output_path/comparison.txt"
          }

          capture_transform \
            no-fuse-if-position \
            test/Transforms/FuseProductLoops/no_fuse_if_position.llzk \
            --llzk-fuse-product-loops
          capture_transform \
            no-fuse-if-allocation \
            test/Transforms/FuseProductLoops/no_fuse_if_internal_allocation_in_product.llzk \
            --llzk-fuse-product-loops
          capture_transform \
            fuse-outer-inner \
            test/Transforms/FuseProductLoops/fuse_outer_inner.llzk \
            --llzk-compute-constrain-to-product=root-struct=A \
            --llzk-fuse-product-loops
          capture_transform \
            no-fuse-inner \
            test/Transforms/FuseProductLoops/no_fuse_inner.llzk \
            --llzk-compute-constrain-to-product=root-struct=A \
            --llzk-fuse-product-loops
          capture_transform \
            no-fuse-region-mismatch \
            test/Transforms/FuseProductLoops/no_fuse_region_mismatch.llzk \
            --llzk-compute-constrain-to-product=root-struct=A \
            --llzk-fuse-product-loops
          capture_transform \
            no-fuse-single \
            test/Transforms/FuseProductLoops/no_fuse_single.llzk \
            --llzk-compute-constrain-to-product=root-struct=A \
            --llzk-fuse-product-loops

      - name: Upload generated output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr484-fusion-guard-output-${{ github.sha }}
          path: ${{ runner.temp }}/llzk-pr484-output
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
