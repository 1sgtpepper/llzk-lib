name: LLZK generator replay

on:
  push:
    branches:
      - ci/verify-generator-replays-20260805-final
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify PR ${{ matrix.pr }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - pr: 634
            head: c44aa79218f80d1785342c17f80a2b80d53bf808
            kind: felt
          - pr: 635
            head: 76ee80df099e47200f9a7a0a0c9bea7eb7fbcc83
            kind: deferred
          - pr: 637
            head: cbf1b2770a88685aa625ede7178f4c97367fddd7
            kind: reuse

    env:
      TESTED_HEAD: ${{ matrix.head }}
      TEST_KIND: ${{ matrix.kind }}
      TESTED_PATH: /tmp/llzk-pr-${{ matrix.pr }}
      OUTPUT_PATH: /tmp/llzk-generator-output/pr-${{ matrix.pr }}

    steps:
      - name: Check out validation workflow
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@d1ca217b388ee87b2507a9a93bf01368bde7cec2
        with:
          install_url: https://releases.nixos.org/nix/nix-2.23.3/install
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Git credentials
        run: |
          git config --global 'url.https://api@github.com/'.insteadOf 'https://github.com/'
          git config --global 'url.https://ssh@github.com/'.insteadOf 'ssh://git@github.com/'
          git config --global 'url.https://git@github.com/'.insteadOf 'git@github.com:'

      - name: Use project build cache
        uses: cachix/cachix-action@v17
        with:
          name: veridise-public
          skipPush: true

      - name: Build exact reviewed head
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --filter=blob:none https://github.com/1sgtpepper/llzk-lib.git "$TESTED_HEAD"
          git worktree add --detach "$TESTED_PATH" "$TESTED_HEAD"
          test "$(git -C "$TESTED_PATH" rev-parse HEAD)" = "$TESTED_HEAD"
          (
            cd "$TESTED_PATH"
            nix --print-build-logs build '.#debugGCC'
          )
          test -x "$TESTED_PATH/result/bin/llzk-opt"
          test -x "$TESTED_PATH/result/bin/llzk-witgen"

      - name: Replay exact-head FileCheck pipelines
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_PATH"
          FILECHECK="$(find /nix/store -type f -path '*/bin/FileCheck' -executable -print -quit)"
          test -n "$FILECHECK"
          LLZK_OPT="$TESTED_PATH/result/bin/llzk-opt"
          LLZK_WITGEN="$TESTED_PATH/result/bin/llzk-witgen"

          count_checks() {
            grep -Ec '^// CHECK' "$1" || true
          }

          record_transform_case() {
            local name="$1"
            local test_file="$2"
            local stream="$3"
            local check_scope="$4"
            shift 4

            local input="$TESTED_PATH/$test_file"
            local output_path="$OUTPUT_PATH/$name"
            local producer_output="$output_path/producer-output.llzk"
            mkdir -p "$output_path"

            local -a command=("$LLZK_OPT")
            for argument in "$@"; do
              if [[ "$argument" == __TEST__ ]]; then
                command+=("$input")
              else
                command+=("$argument")
              fi
            done

            if [[ "$stream" == combined ]]; then
              "${command[@]}" > "$producer_output" 2>&1
            else
              "${command[@]}" > "$producer_output"
            fi

            local -a check_args=()
            if [[ "$check_scope" == scoped ]]; then
              check_args+=(--enable-var-scope)
            fi
            "${FILECHECK}" "${check_args[@]}" "$input" < "$producer_output"

            local committed_count
            local generated_count
            committed_count="$(count_checks "$input")"
            generated_count=0
            local output_chunk_count=1
            if grep -q '^// -----$' "$producer_output"; then
              local chunks_path="$output_path/producer-chunks"
              local checks_path="$output_path/fresh-generated-checks"
              mkdir -p "$chunks_path" "$checks_path"
              awk -v dir="$chunks_path" '
                BEGIN {
                  chunk = 0
                  file = sprintf("%s/chunk-%03d.llzk", dir, chunk)
                }
                /^\/\/ -----$/ {
                  close(file)
                  chunk++
                  file = sprintf("%s/chunk-%03d.llzk", dir, chunk)
                  next
                }
                { print > file }
                END { close(file) }
              ' "$producer_output"

              output_chunk_count="$(find "$chunks_path" -maxdepth 1 -type f -name '*.llzk' | wc -l)"
              local source_delimiter_count
              local source_chunk_count
              source_delimiter_count="$(grep -Ec '^// -----$' "$input" || true)"
              source_chunk_count=$((source_delimiter_count + 1))
              test "$output_chunk_count" -eq "$source_chunk_count"

              local chunk
              for chunk in "$chunks_path"/*.llzk; do
                local chunk_name="${chunk##*/}"
                chunk_name="${chunk_name%.llzk}"
                local fresh_checks="$checks_path/$chunk_name.txt"
                python3 "$TESTED_PATH/scripts/generate-test-checks.py" \
                  < "$chunk" \
                  > "$fresh_checks"
                "${FILECHECK}" "${check_args[@]}" "$fresh_checks" < "$chunk"
                generated_count=$((generated_count + $(count_checks "$fresh_checks")))
              done
            else
              local generated_checks="$output_path/fresh-generated-checks.txt"
              python3 "$TESTED_PATH/scripts/generate-test-checks.py" \
                < "$producer_output" \
                > "$generated_checks"
              "${FILECHECK}" "${check_args[@]}" "$generated_checks" < "$producer_output"
              generated_count="$(count_checks "$generated_checks")"
            fi
            test "$committed_count" -eq "$generated_count"

            {
              echo "head=$TESTED_HEAD"
              echo "test=$test_file"
              printf 'producer_command='
              printf '%q ' "${command[@]}"
              printf '\n'
              echo "committed_check_lines=$committed_count"
              echo "fresh_generated_check_lines=$generated_count"
              echo "output_chunks=$output_chunk_count"
              echo "committed_checks_against_exact_head_output=PASS"
              echo "fresh_generated_checks_against_exact_head_output=PASS"
              echo "complete_check_line_count=PASS"
            } > "$output_path/comparison.txt"
          }

          record_diagnostic_case() {
            local name="$1"
            local test_file="$2"
            shift 2
            local input="$TESTED_PATH/$test_file"
            local output_path="$OUTPUT_PATH/$name"
            local producer_output="$output_path/producer-output.txt"
            mkdir -p "$output_path"

            local -a command=("$LLZK_OPT")
            for argument in "$@"; do
              if [[ "$argument" == __TEST__ ]]; then
                command+=("$input")
              else
                command+=("$argument")
              fi
            done
            "${command[@]}" > "$producer_output" 2>&1
            "$FILECHECK" --enable-var-scope "$input" < "$producer_output"

            {
              echo "head=$TESTED_HEAD"
              echo "test=$test_file"
              printf 'producer_command='
              printf '%q ' "${command[@]}"
              printf '\n'
              echo "diagnostic_and_command_output_contract=PASS"
            } > "$output_path/comparison.txt"
          }

          record_witgen_case() {
            local name="$1"
            local backend="$2"
            local output_path="$OUTPUT_PATH/$name"
            local test_file=test/Witgen/felt_template_parameter_pipeline.llzk
            local check_file="$TESTED_PATH/$test_file"
            local output="$output_path/witgen-output.txt"
            mkdir -p "$output_path"

            local -a backend_args=()
            if [[ -n "$backend" ]]; then
              backend_args+=("$backend")
            fi

            (
              cd "$TESTED_PATH/test/Witgen"
              "$LLZK_WITGEN" \
                ../FrontendLang/Circom/large_const_main.llzk \
                --inputs Inputs/felt_template_parameter_input.json \
                "${backend_args[@]}" \
                --check-output Inputs/felt_template_parameter_output.json
            ) > "$output"
            "$FILECHECK" "$check_file" < "$output"

            {
              echo "head=$TESTED_HEAD"
              echo "test=$test_file"
              echo "backend=${backend#--backend=}"
              echo "external_witness_output_contract=PASS"
            } > "$output_path/comparison.txt"
          }

          case "$TEST_KIND" in
            felt)
              record_transform_case \
                call-pass \
                test/Dialect/Function/call_with_template_params_pass.llzk \
                combined scoped \
                -split-input-file __TEST__
              record_transform_case \
                struct-pass \
                test/Dialect/Struct/struct_params_pass.llzk \
                combined scoped \
                -split-input-file __TEST__
              record_transform_case \
                contracts-pass \
                test/Dialect/Verif/contracts_pass.llzk \
                combined scoped \
                -split-input-file __TEST__
              record_transform_case \
                felt-materialization \
                test/Transforms/Flattening/instantiate_felt_materialization.llzk \
                stdout plain \
                -split-input-file __TEST__ -llzk-flatten
              record_transform_case \
                name-encoding \
                test/Transforms/Flattening/instantiate_name_encoding.llzk \
                stdout scoped \
                -split-input-file -llzk-flatten=cleanup=disabled __TEST__
              record_witgen_case interpreter
              record_witgen_case execution-engine --backend=execution-engine
              ;;
            deferred)
              record_diagnostic_case \
                expr-fail \
                test/Transforms/Flattening/instantiate_expr_fail.llzk \
                -split-input-file -llzk-flatten -verify-diagnostics __TEST__
              record_transform_case \
                expr-partial \
                test/Transforms/Flattening/instantiate_expr_partial.llzk \
                stdout plain \
                -split-input-file -llzk-flatten __TEST__
              record_transform_case \
                expr-target-local \
                test/Transforms/Flattening/instantiate_expr_target_local.llzk \
                stdout plain \
                -split-input-file \
                '--pass-pipeline=builtin.module(llzk-flatten{cleanup=disabled})' \
                __TEST__
              ;;
            reuse)
              record_transform_case \
                function-reuse \
                test/Transforms/Flattening/instantiate_function_reuse.llzk \
                stdout plain \
                -split-input-file -llzk-flatten=cleanup=disabled __TEST__
              ;;
            *)
              echo "unknown validation kind: $TEST_KIND" >&2
              exit 1
              ;;
          esac

      - name: Upload exact-head FileCheck evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: generator-replay-evidence-pr-${{ matrix.pr }}-${{ github.sha }}
          path: /tmp/llzk-generator-output/pr-${{ matrix.pr }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
