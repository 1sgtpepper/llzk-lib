name: LLZK generator replay

on:
  push:
    branches:
      - ci/verify-generator-replays-20260806-final-heads
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      OUTPUT_PATH: /tmp/llzk-generator-output

    steps:
      - name: Check out validation workflow
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@d1ca217b388ee87b2507a9a93bf01368bde7cec2
        with:
          install_url: https://releases.nixos.org/nix/nix-2.23.3/install
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Git credentials
        run: |
          git config --global 'url.https://api@github.com/'.insteadOf 'https://github.com/'
          git config --global 'url.https://ssh@github.com/'.insteadOf 'ssh://git@github.com/'
          git config --global 'url.https://git@github.com/'.insteadOf 'git@github.com:'

      - name: Use project build cache
        uses: cachix/cachix-action@v17
        with:
          name: veridise-public
          skipPush: true

      - name: Replay exact-head generator evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUTPUT_PATH"
          mkdir -p "$OUTPUT_PATH"

          find_filecheck() {
            find /nix/store -type f -path '*/bin/FileCheck' -executable -print -quit
          }

          replay_split_transform() {
            local name="$1"
            local head="$2"
            local test_file="$3"
            shift 3
            local tested_path="$RUNNER_TEMP/llzk-$name"
            local chunk_dir="$RUNNER_TEMP/llzk-$name-chunks"
            local output_path="$OUTPUT_PATH/$name"

            git fetch --no-tags --filter=blob:none https://github.com/1sgtpepper/llzk-lib.git "$head"
            git worktree add --detach "$tested_path" "$head"
            test "$(git -C "$tested_path" rev-parse HEAD)" = "$head"

            (
              cd "$tested_path"
              nix --print-build-logs build '.#debugGCC'
            )

            mkdir -p "$output_path"
            local llzk_opt="$tested_path/result/bin/llzk-opt"
            local filecheck
            filecheck="$(find_filecheck)"
            test -x "$llzk_opt"
            test -n "$filecheck"

            cp "$(readlink -f "$llzk_opt")" "$output_path/llzk-opt"
            "$llzk_opt" --version > "$output_path/llzk-opt.version"
            mkdir -p "$chunk_dir" "$output_path"
            python3 - "$tested_path/$test_file" "$chunk_dir" <<'PY'
          from pathlib import Path
          import sys

          source = Path(sys.argv[1]).read_text()
          output = Path(sys.argv[2])
          chunks = source.split("// -----")
          for index, chunk in enumerate(chunks):
              lines = chunk.splitlines()
              (output / f"committed-{index:02d}.llzk").write_text(
                  "\n".join(lines).strip() + "\n"
              )
          clean_lines = [
              line
              for line in source.splitlines()
              if not line.startswith("// CHECK")
              and not line.startswith("// NOTE: Assertions have been autogenerated")
          ]
          (output / "clean.llzk").write_text("\n".join(clean_lines).strip() + "\n")
          PY

            "$llzk_opt" "$@" "$chunk_dir/clean.llzk" \
              > "$output_path/producer-output.llzk" 2>&1
            python3 - "$output_path/producer-output.llzk" "$chunk_dir" <<'PY'
          from pathlib import Path
          import sys

          source = Path(sys.argv[1]).read_text()
          output = Path(sys.argv[2])
          for index, chunk in enumerate(source.split("// -----")):
              (output / f"output-{index:02d}.llzk").write_text(
                  "\n".join(chunk.splitlines()).strip() + "\n"
              )
          PY

            local chunk_count=0
            local committed_checks=0
            local generated_checks=0
            for output_file in "$chunk_dir"/output-*.llzk; do
              local chunk_name
              chunk_name="$(basename "$output_file" .llzk | sed 's/^output-//')"
              local committed_file="$chunk_dir/committed-$chunk_name.llzk"
              local checks_file="$output_path/generated-checks-$chunk_name.txt"
              test -f "$committed_file"
              cp "$committed_file" "$output_path/committed-test-$chunk_name.llzk"
              python3 "$tested_path/scripts/generate-test-checks.py" \
                < "$output_file" \
                > "$checks_file"
              "$filecheck" "$committed_file" < "$output_file"
              "$filecheck" "$checks_file" < "$output_file"
              committed_chunk_checks=$(grep -Ec '^// CHECK(:|-LABEL:|-NEXT:)' "$committed_file" || true)
              generated_chunk_checks=$(grep -Ec '^// CHECK(:|-LABEL:|-NEXT:)' "$checks_file" || true)
              committed_checks=$((committed_checks + committed_chunk_checks))
              generated_checks=$((generated_checks + generated_chunk_checks))
              chunk_count=$((chunk_count + 1))
            done

            test "$chunk_count" -eq 3
            test "$committed_checks" -eq "$generated_checks"

            {
              echo "head=$head"
              echo "test=$test_file"
              echo "producer_command=result/bin/llzk-opt $* $test_file"
              echo "split_boundary=// -----"
              echo "chunk_count=$chunk_count"
              echo "committed_check_lines=$committed_checks"
              echo "fresh_generated_check_lines=$generated_checks"
              echo "committed_checks_against_exact_head_output=PASS"
              echo "fresh_generated_checks_against_exact_head_output=PASS"
              echo "complete_check_line_count=PASS"
            } > "$output_path/comparison.txt"
          }

          replay_split_transform \
            pr635 \
            1e83a0529f5b955aeec63195f5decc3900ebac0e \
            test/Transforms/Flattening/instantiate_expr_felt_typevar_completion.llzk \
            -split-input-file \
            -llzk-flatten

      - name: Upload exact-head generator evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: generator-replay-evidence-${{ github.sha }}
          path: /tmp/llzk-generator-output
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
