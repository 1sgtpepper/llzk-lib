name: LLZK generator replay

on:
  push:
    branches:
      - ci/verify-generator-replays-20260805-final-heads
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      OUTPUT_PATH: /tmp/llzk-generator-output

    steps:
      - name: Check out validation workflow
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@d1ca217b388ee87b2507a9a93bf01368bde7cec2
        with:
          install_url: https://releases.nixos.org/nix/nix-2.23.3/install
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Git credentials
        run: |
          git config --global 'url.https://api@github.com/'.insteadOf 'https://github.com/'
          git config --global 'url.https://ssh@github.com/'.insteadOf 'ssh://git@github.com/'
          git config --global 'url.https://git@github.com/'.insteadOf 'git@github.com:'

      - name: Use project build cache
        uses: cachix/cachix-action@v17
        with:
          name: veridise-public
          skipPush: true

      - name: Replay exact-head generator evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUTPUT_PATH"
          mkdir -p "$OUTPUT_PATH"

          find_filecheck() {
            find /nix/store -type f -path '*/bin/FileCheck' -executable -print -quit
          }

          replay_transform() {
            local name="$1"
            local head="$2"
            local pass_name="$3"
            local test_file="$4"
            local tested_path="$RUNNER_TEMP/llzk-$name"
            local output_path="$OUTPUT_PATH/$name"

            git fetch --no-tags --filter=blob:none https://github.com/1sgtpepper/llzk-lib.git "$head"
            git worktree add --detach "$tested_path" "$head"
            test "$(git -C "$tested_path" rev-parse HEAD)" = "$head"

            (
              cd "$tested_path"
              nix --print-build-logs build '.#debugGCC'
            )

            mkdir -p "$output_path"
            local llzk_opt="$tested_path/result/bin/llzk-opt"
            local filecheck
            filecheck="$(find_filecheck)"
            test -x "$llzk_opt"
            test -n "$filecheck"

            cp "$(readlink -f "$llzk_opt")" "$output_path/llzk-opt"
            "$llzk_opt" --version > "$output_path/llzk-opt.version"
            cp "$tested_path/$test_file" "$output_path/committed-test.llzk"
            "$llzk_opt" "$pass_name" "$tested_path/$test_file" \
              > "$output_path/producer-output.llzk" 2>&1
            python3 "$tested_path/scripts/generate-test-checks.py" \
              < "$output_path/producer-output.llzk" \
              > "$output_path/generated-checks.txt"

            "$filecheck" "$tested_path/$test_file" \
              < "$output_path/producer-output.llzk"
            "$filecheck" "$output_path/generated-checks.txt" \
              < "$output_path/producer-output.llzk"

            local committed_checks
            local generated_checks
            committed_checks=$(grep -Ec '^// CHECK(:|-LABEL:|-NEXT:)' "$tested_path/$test_file")
            generated_checks=$(grep -Ec '^// CHECK(:|-LABEL:|-NEXT:)' "$output_path/generated-checks.txt")
            test "$committed_checks" -eq "$generated_checks"

            {
              echo "head=$head"
              echo "test=$test_file"
              echo "producer_command=result/bin/llzk-opt $pass_name $test_file"
              echo "committed_check_lines=$committed_checks"
              echo "fresh_generated_check_lines=$generated_checks"
              echo "committed_checks_against_exact_head_output=PASS"
              echo "fresh_generated_checks_against_exact_head_output=PASS"
              echo "complete_check_line_count=PASS"
            } > "$output_path/comparison.txt"
          }

          replay_script() {
            local head="$1"
            local test_file="$2"
            local tested_path="$RUNNER_TEMP/llzk-pr672"
            local output_path="$OUTPUT_PATH/pr672"

            git fetch --no-tags --filter=blob:none https://github.com/1sgtpepper/llzk-lib.git "$head"
            git worktree add --detach "$tested_path" "$head"
            test "$(git -C "$tested_path" rev-parse HEAD)" = "$head"

            (
              cd "$tested_path"
              nix --print-build-logs build '.#debugGCC'
            )

            mkdir -p "$output_path"
            local llzk_opt="$tested_path/result/bin/llzk-opt"
            local filecheck
            filecheck="$(find_filecheck)"
            test -x "$llzk_opt"
            test -n "$filecheck"

            cp "$(readlink -f "$llzk_opt")" "$output_path/llzk-opt"
            "$llzk_opt" --version > "$output_path/llzk-opt.version"
            cp "$tested_path/$test_file" "$output_path/committed-test.llzk"
            awk '
              /^\/\/--- inline-attributes\.llzk$/ { in_chunk = 1; next }
              in_chunk { print }
            ' "$tested_path/$test_file" > "$output_path/inline-attributes.llzk"
            python3 "$tested_path/scripts/generate-test-checks.py" \
              "$output_path/inline-attributes.llzk" \
              > "$output_path/generated-checks.txt"
            python3 "$tested_path/scripts/generate-test-checks.py" \
              "$output_path/inline-attributes.llzk" \
              | "$filecheck" "$tested_path/$test_file" --check-prefix=SCRIPT

            {
              echo "head=$head"
              echo "test=$test_file"
              echo "generator_command=python3 scripts/generate-test-checks.py < actual split chunk"
              echo "fresh_generator_stdout=PASS"
              echo "focused_script_contract=PASS"
            } > "$output_path/comparison.txt"
          }

          replay_transform \
            pr670 \
            38c87fd0054cb01ee16a754bcfc6d1653924969d \
            -llzk-duplicate-op-elim \
            test/Transforms/RedundantAndUnusedElim/recursive_purposeless_constrain_repro.llzk
          replay_transform \
            pr671 \
            f0727939bcbf451df0a9a97227bba8c57aa7072d \
            -llzk-duplicate-read-write-elim \
            test/Transforms/RedundantAndUnusedElim/array_dynamic_constant_alias.llzk
          replay_script \
            08ce3267d55ba2d1574915152a42400109289614 \
            test/Transforms/generate-test-checks-inline-attributes.llzk

      - name: Upload exact-head generator evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: generator-replay-evidence-${{ github.sha }}
          path: /tmp/llzk-generator-output
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
