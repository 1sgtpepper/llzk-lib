name: Issue 673 generator replay

on:
  push:
    branches:
      - validation/issue-673-generator-replay
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact fork commit to build and compare
        required: false
        default: e2afb821ee0035e3a05191e0d7c1a0d87330f32b
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      OUTPUT_PATH: /tmp/issue-673-generator

    steps:
      - name: Check out target commit
        uses: actions/checkout@v6
        with:
          repository: 1sgtpepper/llzk-lib
          ref: ${{ inputs.target_sha || 'e2afb821ee0035e3a05191e0d7c1a0d87330f32b' }}
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@d1ca217b388ee87b2507a9a93bf01368bde7cec2
        with:
          install_url: https://releases.nixos.org/nix/nix-2.23.3/install
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Git credentials
        run: |
          git config --global 'url.https://api@github.com/'.insteadOf 'https://github.com/'
          git config --global 'url.https://ssh@github.com/'.insteadOf 'ssh://git@github.com/'
          git config --global 'url.https://git@github.com/'.insteadOf 'git@github.com:'

      - name: Use project build cache
        uses: cachix/cachix-action@v17
        with:
          name: veridise-public
          skipPush: true

      - name: Build and replay exact-head checks
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUTPUT_PATH"
          mkdir -p "$OUTPUT_PATH"

          target_sha="${{ inputs.target_sha || 'e2afb821ee0035e3a05191e0d7c1a0d87330f32b' }}"
          compare_committed=true
          test "$(git rev-parse HEAD)" = "$target_sha"

          nix --print-build-logs build --impure --expr \
            'let flake = builtins.getFlake (toString ./.); in flake.packages.x86_64-linux.llzk-debug.overrideAttrs (_: { doCheck = false; })'
          llzk_opt="$GITHUB_WORKSPACE/result/bin/llzk-opt"
          llzk_witgen="$GITHUB_WORKSPACE/result/bin/llzk-witgen"
          filecheck="$(find /nix/store -type f -path '*/bin/FileCheck' -executable -print -quit)"
          split_file="$(find /nix/store -type f -path '*/bin/split-file' -executable -print -quit)"
          test -x "$llzk_opt"
          test -x "$llzk_witgen"
          test -n "$filecheck"
          test -n "$split_file"

          echo "target_sha=$target_sha" > "$OUTPUT_PATH/comparison.txt"
          echo "checked_out_head=$(git rev-parse HEAD)" >> "$OUTPUT_PATH/comparison.txt"

          for test_file in \
              test/Transforms/RedundantAndUnusedElim/array_dynamic_constant_alias.llzk \
              test/Transforms/RedundantAndUnusedElim/array_dynamic_read_recursive_alias.llzk \
              test/Transforms/RedundantAndUnusedElim/array_dynamic_read_region_alias.llzk; do
            test_name="$(basename "$test_file" .llzk)"
            test_output="$OUTPUT_PATH/$test_name"
            clean_file="$RUNNER_TEMP/$test_name-clean.llzk"
            mkdir -p "$test_output"
            cp "$test_file" "$test_output/source.llzk"

            python3 - "$test_file" "$clean_file" <<'PY'
          from pathlib import Path
          import sys

          source = Path(sys.argv[1]).read_text()
          lines = [
              line
              for line in source.splitlines()
              if not line.startswith("// CHECK")
              and not line.startswith("// NOTE: Assertions have been autogenerated")
          ]
          Path(sys.argv[2]).write_text("\n".join(lines).strip() + "\n")
          PY

            run_line="$(sed -n '1p' "$test_file")"
            producer="${run_line#// RUN: }"
            producer="${producer%%| FileCheck*}"
            producer="${producer//%s/$clean_file}"
            PATH="$GITHUB_WORKSPACE/result/bin:$PATH" bash -o pipefail -c "$producer" \
                > "$test_output/producer-output.llzk" 2>&1
            python3 scripts/generate-test-checks.py \
                < "$test_output/producer-output.llzk" \
                > "$test_output/generated-checks.raw.txt"
            python3 - "$test_output/generated-checks.raw.txt" "$test_output/generated-checks.txt" <<'PY'
          from pathlib import Path
          import sys

          generated = [
              line
              for line in Path(sys.argv[1]).read_text().splitlines()
              if line.startswith("// CHECK")
          ]
          Path(sys.argv[2]).write_text("\n".join(generated) + "\n")
          PY
            "$filecheck" --enable-var-scope "$test_file" \
                < "$test_output/producer-output.llzk"
            "$filecheck" --enable-var-scope "$test_output/generated-checks.txt" \
                < "$test_output/producer-output.llzk"
            committed_checks="$RUNNER_TEMP/$test_name-committed-checks.txt"
            grep '^// CHECK' "$test_file" > "$committed_checks"
            if [ "$compare_committed" = "true" ]; then
              diff -u "$committed_checks" "$test_output/generated-checks.txt"
              comparison_status=PASS
            else
              comparison_status=SKIPPED
            fi
            check_count="$(grep -Ec '^// CHECK' "$test_output/generated-checks.txt")"
            echo "$test_name.check_lines=$check_count" >> "$OUTPUT_PATH/comparison.txt"
            echo "$test_name.committed_checks=$comparison_status" \
                >> "$OUTPUT_PATH/comparison.txt"
          done

          for test_file in \
              test/Witgen/redundant_read_write_issue_673.llzk \
              test/Witgen/redundant_read_write_issue_673_region.llzk; do
            test_name="$(basename "$test_file" .llzk)"
            witness_dir="$RUNNER_TEMP/$test_name"
            output_dir="$OUTPUT_PATH/$test_name"
            rm -rf "$witness_dir" "$output_dir"
            mkdir -p "$output_dir"
            cp "$test_file" "$output_dir/source.llzk"
            "$split_file" "$test_file" "$witness_dir"

            "$llzk_opt" -llzk-duplicate-read-write-elim "$witness_dir/test.llzk" \
                -o "$witness_dir/optimized.llzk"
            for input_name in zero one; do
              input="$witness_dir/input-$input_name.json"
              expected="$witness_dir/expected-$input_name.json"
              "$llzk_witgen" "$witness_dir/test.llzk" --inputs "$input" \
                  --check-output "$expected" > "$output_dir/original-$input_name.txt" 2>&1
              "$llzk_witgen" "$witness_dir/optimized.llzk" --inputs "$input" \
                  --check-output "$expected" > "$output_dir/optimized-$input_name.txt" 2>&1
            done

            if [ "$test_name" = redundant_read_write_issue_673 ]; then
              "$llzk_opt" -llzk-duplicate-read-write-elim "$witness_dir/recursive.llzk" \
                  -o "$witness_dir/recursive-optimized.llzk"
              for input_name in zero one; do
                input="$witness_dir/recursive-$input_name.json"
                expected="$witness_dir/recursive-expected-$input_name.json"
                "$llzk_witgen" "$witness_dir/recursive.llzk" --inputs "$input" \
                    --check-output "$expected" > "$output_dir/recursive-original-$input_name.txt" 2>&1
                "$llzk_witgen" "$witness_dir/recursive-optimized.llzk" --inputs "$input" \
                    --check-output "$expected" > "$output_dir/recursive-optimized-$input_name.txt" 2>&1
              done
              "$llzk_witgen" "$witness_dir/test.llzk" \
                  --inputs "$witness_dir/input-zero.json" --backend=execution-engine \
                  --check-output "$witness_dir/expected-zero.json" \
                  > "$output_dir/original-zero-execution-engine.txt" 2>&1
              "$llzk_witgen" "$witness_dir/optimized.llzk" \
                  --inputs "$witness_dir/input-zero.json" --backend=execution-engine \
                  --check-output "$witness_dir/expected-zero.json" \
                  > "$output_dir/optimized-zero-execution-engine.txt" 2>&1
            fi
            echo "$test_name.original_and_optimized_semantics=PASS" \
                >> "$OUTPUT_PATH/comparison.txt"
          done

      - name: Upload exact-head generator evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: issue-673-generator-evidence-${{ github.sha }}
          path: /tmp/issue-673-generator
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
