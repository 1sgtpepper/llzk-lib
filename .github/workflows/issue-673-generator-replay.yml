name: Issue 673 generator replay

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact fork commit to build and compare
        required: true
        type: string
      compare_committed:
        description: Require committed observation CHECK blocks to match generated output
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      OUTPUT_PATH: /tmp/issue-673-generator

    steps:
      - name: Check out target commit
        uses: actions/checkout@v6
        with:
          repository: 1sgtpepper/llzk-lib
          ref: ${{ inputs.target_sha }}
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@d1ca217b388ee87b2507a9a93bf01368bde7cec2
        with:
          install_url: https://releases.nixos.org/nix/nix-2.23.3/install
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Git credentials
        run: |
          git config --global 'url.https://api@github.com/'.insteadOf 'https://github.com/'
          git config --global 'url.https://ssh@github.com/'.insteadOf 'ssh://git@github.com/'
          git config --global 'url.https://git@github.com/'.insteadOf 'git@github.com:'

      - name: Use project build cache
        uses: cachix/cachix-action@v17
        with:
          name: veridise-public
          skipPush: true

      - name: Build and replay exact-head checks
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUTPUT_PATH"
          mkdir -p "$OUTPUT_PATH"

          target_sha="${{ inputs.target_sha }}"
          compare_committed="${{ inputs.compare_committed }}"
          test "$(git rev-parse HEAD)" = "$target_sha"

          nix --print-build-logs build --impure --expr \
            'let flake = builtins.getFlake (toString ./.); in flake.packages.x86_64-linux.llzk-debug.overrideAttrs (_: { doCheck = false; })'
          llzk_opt="$GITHUB_WORKSPACE/result/bin/llzk-opt"
          llzk_witgen="$GITHUB_WORKSPACE/result/bin/llzk-witgen"
          filecheck="$(find /nix/store -type f -path '*/bin/FileCheck' -executable -print -quit)"
          split_file="$(find /nix/store -type f -path '*/bin/split-file' -executable -print -quit)"
          test -x "$llzk_opt"
          test -x "$llzk_witgen"
          test -n "$filecheck"
          test -n "$split_file"

          echo "target_sha=$target_sha" > "$OUTPUT_PATH/comparison.txt"
          echo "checked_out_head=$(git rev-parse HEAD)" >> "$OUTPUT_PATH/comparison.txt"

          for test_file in \
              test/Transforms/RedundantAndUnusedElim/array_read_write_observation.llzk \
              test/Transforms/RedundantAndUnusedElim/redundant_read_write_pass.llzk \
              test/Transforms/RedundantAndUnusedElim/redundant_op_pass.llzk; do
            test_name="$(basename "$test_file" .llzk)"
            chunk_dir="$RUNNER_TEMP/$test_name-chunks"
            committed_dir="$RUNNER_TEMP/$test_name-committed"
            test_output="$OUTPUT_PATH/$test_name"
            mkdir -p "$chunk_dir" "$committed_dir" "$test_output"

            python3 - "$test_file" "$chunk_dir" "$committed_dir" <<'PY'
          from pathlib import Path
          import sys

          source = Path(sys.argv[1]).read_text()
          output = Path(sys.argv[2])
          committed = Path(sys.argv[3])
          for index, chunk in enumerate(source.split("// -----")):
              lines = [
                  line
                  for line in chunk.splitlines()
                  if not line.startswith("// CHECK")
                  and not line.startswith("// NOTE: Assertions have been autogenerated")
              ]
              (output / f"chunk-{index:02d}.llzk").write_text(
                  "\n".join(lines).strip() + "\n"
              )
              checks = [line for line in chunk.splitlines() if line.startswith("// CHECK")]
              (committed / f"chunk-{index:02d}.committed-checks.txt").write_text(
                  "\n".join(checks) + "\n"
              )
          PY

            for input in "$chunk_dir"/chunk-*.llzk; do
              name="$(basename "$input" .llzk)"
              output_file="$test_output/$name.output.llzk"
              raw_checks_file="$test_output/$name.generated-checks.raw.txt"
              checks_file="$test_output/$name.generated-checks.txt"
              committed_checks_file="$committed_dir/$name.committed-checks.txt"
              if [[ "$test_name" == "redundant_op_pass" ]]; then
                "$llzk_opt" -I test -split-input-file -llzk-inline-includes \
                    -llzk-duplicate-read-write-elim -llzk-duplicate-op-elim "$input" \
                    > "$output_file" 2>&1
              else
                "$llzk_opt" -split-input-file -llzk-duplicate-read-write-elim "$input" \
                    > "$output_file" 2>&1
              fi
              python3 scripts/generate-test-checks.py < "$output_file" > "$raw_checks_file"
              python3 - "$raw_checks_file" "$checks_file" <<'PY'
          from pathlib import Path
          import sys

          generated = Path(sys.argv[1]).read_text().splitlines()
          Path(sys.argv[2]).write_text(
              "\n".join(line for line in generated if line.startswith("// CHECK")) + "\n"
          )
          PY
              "$filecheck" "$checks_file" < "$output_file"
              if [ "$compare_committed" = "true" ]; then
                "$filecheck" "$committed_checks_file" < "$output_file"
                if [[ "$test_name" == "array_read_write_observation" ]]; then
                  diff -u "$committed_checks_file" "$checks_file"
                fi
                comparison_status=PASS
              else
                comparison_status=SKIPPED
              fi
              check_count="$(grep -Ec '^// CHECK' "$checks_file")"
              echo "$test_name.$name.check_lines=$check_count" >> "$OUTPUT_PATH/comparison.txt"
              echo "$test_name.$name.committed_checks=$comparison_status" \
                  >> "$OUTPUT_PATH/comparison.txt"
            done
          done

          witness_dir="$RUNNER_TEMP/redundant-read-write-semantics"
          "$split_file" test/Witgen/redundant_read_write_semantics.llzk "$witness_dir"
          for case_name in member partial; do
            source="$witness_dir/$case_name.llzk"
            input="$witness_dir/$case_name-input.json"
            expected="$witness_dir/$case_name-expected.json"
            optimized="$witness_dir/$case_name-optimized.llzk"
            "$llzk_witgen" "$source" --inputs "$input" --check-output "$expected"
            if [ "$case_name" = partial ]; then
              "$llzk_witgen" "$source" --inputs "$input" --backend=execution-engine \
                  --check-output "$expected"
            else
              scalarized="$witness_dir/$case_name-scalarized.llzk"
              "$llzk_opt" -llzk-array-to-scalar "$source" -o "$scalarized"
              "$llzk_witgen" "$scalarized" --inputs "$input" --check-output "$expected"
              "$llzk_witgen" "$scalarized" --inputs "$input" --backend=execution-engine \
                  --check-output "$expected"
            fi
            "$llzk_opt" -llzk-duplicate-read-write-elim "$source" -o "$optimized"
            "$llzk_witgen" "$optimized" --inputs "$input" --check-output "$expected"
            if [ "$case_name" = partial ]; then
              "$llzk_witgen" "$optimized" --inputs "$input" --backend=execution-engine \
                  --check-output "$expected"
            else
              optimized_scalarized="$witness_dir/$case_name-optimized-scalarized.llzk"
              "$llzk_opt" -llzk-array-to-scalar "$optimized" -o "$optimized_scalarized"
              "$llzk_witgen" "$optimized_scalarized" --inputs "$input" \
                  --check-output "$expected"
              "$llzk_witgen" "$optimized_scalarized" --inputs "$input" \
                  --backend=execution-engine --check-output "$expected"
            fi
            echo "$case_name.original_and_optimized_semantics=PASS" \
                >> "$OUTPUT_PATH/comparison.txt"
          done

      - name: Upload exact-head generator evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: issue-673-generator-evidence-${{ github.sha }}
          path: /tmp/issue-673-generator
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
