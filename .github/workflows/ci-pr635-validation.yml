name: LLZK PR 637 validation evidence

on:
  push:
    branches:
      - ci/verify-pr637-output-20260831

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-24.04
    env:
      OUTPUT_PATH: /tmp/llzk-validation-output

    steps:
      - name: Check out validation workflow
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@d1ca217b388ee87b2507a9a93bf01368bde7cec2
        with:
          install_url: https://releases.nixos.org/nix/nix-2.23.3/install
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Git credentials
        run: |
          git config --global 'url.https://api@github.com/'.insteadOf 'https://github.com/'
          git config --global 'url.https://ssh@github.com/'.insteadOf 'ssh://git@github.com/'
          git config --global 'url.https://git@github.com/'.insteadOf 'git@github.com:'

      - name: Use project build cache
        uses: cachix/cachix-action@v17
        with:
          name: veridise-public
          skipPush: true

      - name: Replay exact PR-head transformation checks
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUTPUT_PATH"
          mkdir -p "$OUTPUT_PATH"

          pr637_head=76a52d90e00e861acdb0ff0a8bd1c2706e0dbe74
          filecheck=
          full_check_results=()
          focused_results=()

          prepare_head() {
            local name="$1"
            local head="$2"
            tested_path="$RUNNER_TEMP/llzk-$name"
            git fetch --no-tags --filter=blob:none https://github.com/1sgtpepper/llzk-lib.git "$head"
            git worktree add --detach "$tested_path" "$head"
            test "$(git -C "$tested_path" rev-parse HEAD)" = "$head"
            rm -f "$tested_path/result"
            (
              cd "$tested_path"
              nix --print-build-logs build --impure --out-link "$tested_path/result" --expr \
                'let flake = builtins.getFlake (toString ./.); in flake.packages.x86_64-linux.debugGCC.overrideAttrs (_: { doCheck = false; })'
            )
            result_path=$(readlink -f "$tested_path/result")
            printf 'result_path=%s\n' "$result_path"
            ls -ld "$tested_path/result" "$result_path" "$result_path/bin" "$result_path/bin/llzk-opt"
            test -e "$result_path/bin/llzk-opt"
            test -x "$result_path/bin/llzk-opt"
          }

          replay_test() {
            local name="$1"
            local source_root="$2"
            local test_file="$3"
            local check_prefix="$4"
            shift 4
            local allow_nonzero=false
            local extract_module=false
            local merge_stderr=false
            local filecheck_args=()
            while [[ "$#" -gt 0 ]]; do
              case "$1" in
                --allow-nonzero)
                  allow_nonzero=true
                  shift
                  ;;
                --extract-module)
                  extract_module=true
                  shift
                  ;;
                --merge-stderr)
                  merge_stderr=true
                  shift
                  ;;
                --enable-var-scope)
                  filecheck_args+=("$1")
                  shift
                  ;;
                *)
                  break
                  ;;
              esac
            done
            local output_path="$OUTPUT_PATH/$name"
            local llzk_opt="$source_root/result/bin/llzk-opt"
            # Keep the temporary input beside the fixture so relative include paths resolve exactly
            # as they do under lit. Copy it into the artifact before removing it from the worktree.
            local clean_input="$source_root/${test_file%.llzk}.validation-input.llzk"
            mkdir -p "$output_path"
            if [[ -z "$filecheck" ]]; then
              filecheck="$(find /nix/store -type f -path '*/bin/FileCheck' -executable -print -quit)"
              test -n "$filecheck"
            fi

            cp "$source_root/$test_file" "$output_path/committed-test.llzk"
            python3 - "$source_root/$test_file" "$clean_input" <<'PY'
          from pathlib import Path
          import re
          import sys

          source = Path(sys.argv[1]).read_text()
          output = Path(sys.argv[2])
          check_re = re.compile(
              r"^// [A-Z][A-Z0-9_-]*(?::|-LABEL:|-NEXT:|-SAME:|-NOT:|-DAG:|-EMPTY:)"
          )
          clean = [
              line
              for line in source.splitlines()
              if not line.startswith("// RUN:")
              and not check_re.match(line)
              and not line.startswith("// NOTE: Assertions have been autogenerated")
          ]
          output.write_text("\n".join(clean).strip() + "\n")
          PY
            cp "$clean_input" "$output_path/clean-input.llzk"

            {
              printf 'result/bin/llzk-opt'
              printf ' %q' "$@"
              printf ' %q\n' "$clean_input"
            } > "$output_path/producer-command.txt"
            set +e
            if [[ "$merge_stderr" == true ]]; then
              "$llzk_opt" "$@" "$clean_input" \
                > "$output_path/producer-output.raw.txt" 2>&1
            else
              "$llzk_opt" "$@" "$clean_input" \
                > "$output_path/producer-output.raw.txt" \
                2> "$output_path/producer-stderr.txt"
            fi
            local producer_status=$?
            set -e
            printf 'producer_exit_status=%s\n' "$producer_status" \
              > "$output_path/producer-status.txt"
            if test "$producer_status" -ne 0 && [[ "$allow_nonzero" != true ]]; then
              printf 'producer failed for %s with exit status %s\n' \
                "$test_file" "$producer_status"
              sed -n '1,160p' "$output_path/producer-stderr.txt"
              return "$producer_status"
            fi

            if [[ "$extract_module" == true ]]; then
              awk '
                /^module attributes / { emit = 1 }
                emit { print }
                emit && /^}$/ { exit }
              ' "$output_path/producer-output.raw.txt" \
                > "$output_path/producer-output.llzk"
              test -s "$output_path/producer-output.llzk"
            else
              cp "$output_path/producer-output.raw.txt" \
                "$output_path/producer-output.llzk"
            fi

            "$filecheck" "${filecheck_args[@]}" --check-prefix="$check_prefix" \
              "$source_root/$test_file" \
              < "$output_path/producer-output.llzk" \
              > "$output_path/committed-filecheck.txt" 2>&1
            python3 "$source_root/scripts/generate-test-checks.py" \
              --check-prefix="$check_prefix" \
              < "$output_path/producer-output.llzk" \
              > "$output_path/generated-checks.txt"
            local generated_filecheck_status=PASS
            if ! "$filecheck" "${filecheck_args[@]}" --check-prefix="$check_prefix" \
              "$output_path/generated-checks.txt" \
              < "$output_path/producer-output.llzk" \
              > "$output_path/generated-filecheck.txt" 2>&1; then
              generated_filecheck_status=FAIL_BEFORE_PLACEMENT_NORMALIZATION
            fi

            local committed_checks=0
            local generated_checks=0
            python3 - "$output_path/committed-test.llzk" \
                "$output_path/generated-checks.txt" \
                "$output_path/comparison.txt" \
                "$output_path/check-comparison.diff" \
                "$check_prefix" <<'PY'
          from difflib import unified_diff
          from pathlib import Path
          import re
          import sys

          committed_path = Path(sys.argv[1])
          generated_path = Path(sys.argv[2])
          comparison_path = Path(sys.argv[3])
          diff_path = Path(sys.argv[4])
          prefix = sys.argv[5]
          directive_re = re.compile(
              rf"^// {re.escape(prefix)}(?::|-LABEL:|-NEXT:|-SAME:|-NOT:|-DAG:|-EMPTY:)"
          )
          committed = [
              line for line in committed_path.read_text().splitlines()
              if directive_re.match(line)
          ]
          generated = [
              line for line in generated_path.read_text().splitlines()
              if directive_re.match(line)
          ]
          adjustments = []

          def normalize(lines, source):
              normalized = []
              after_not = False
              for line in lines:
                  if line.startswith(f"// {prefix}-NOT:"):
                      adjustments.append(f"{source}: bounded CHECK-NOT absence assertion retained")
                      after_not = True
                      continue
                  if after_not:
                      if line.startswith(f"// {prefix}:"):
                          adjustments.append(f"{source}: CHECK after bounded CHECK-NOT normalized to generated NEXT placement")
                          line = line.replace(
                              f"// {prefix}:",
                              f"// {prefix}-NEXT:",
                              1,
                          )
                      after_not = False
                  if "affine_map" in line:
                      adjustments.append(f"{source}: affine-map payload compared separately")
                      continue
                  if line in {
                      "// " + prefix + ":  // {{[-][-][-][-][-]}}",
                      "// " + prefix + "-NEXT:  // {{[-][-][-][-][-]}}",
                  }:
                      adjustments.append(f"{source}: split-safe separator spelling normalized")
                      line = f"// {prefix}-NEXT:  // -----"
                  if line == f"// {prefix}:  // -----":
                      adjustments.append(f"{source}: separator CHECK-NEXT relaxed across blank output line")
                      line = line.replace(
                          f"// {prefix}:  // -----",
                          f"// {prefix}-NEXT:  // -----",
                          1,
                      )
                  normalized.append(line)
              return normalized

          def normalize_variable_names(lines):
              variable_names = {}

              def variable(match):
                  name = match.group(1)
                  if name not in variable_names:
                      variable_names[name] = f"VAR_{len(variable_names)}"
                  return f"[[{variable_names[name]}]]"

              variable_re = re.compile(
                  r"\[\[([A-Za-z_][A-Za-z0-9_]*)(?::(.*?))?\]\]"
              )
              normalized = []
              for line in lines:
                  if line.startswith(f"// {prefix}-LABEL:"):
                      variable_names = {}
                  normalized.append(variable_re.sub(variable, line))
              return normalized

          directive_prefix_re = re.compile(
              rf"^// {re.escape(prefix)}(?:-LABEL|-NEXT|-SAME|-NOT|-DAG|-EMPTY)?:\s*"
          )
          committed_affine = normalize_variable_names([
              directive_prefix_re.sub("", line)
              for line in committed
              if "affine_map" in line
          ])
          generated_affine = normalize_variable_names([
              directive_prefix_re.sub("", line)
              for line in generated
              if "affine_map" in line
          ])
          affine_diff_path = comparison_path.parent / "affine-map-comparison.diff"
          if committed_affine != generated_affine:
              affine_diff = unified_diff(
                  committed_affine,
                  generated_affine,
                  fromfile="committed-affine-map-payloads",
                  tofile="generated-affine-map-payloads",
                  lineterm="",
              )
              affine_diff_path.write_text("\n".join(affine_diff) + "\n")
              raise SystemExit("affine-map CHECK payloads differ from fresh generated output")
          affine_diff_path.write_text("")

          committed_normalized = normalize(committed, "committed")
          generated_normalized = normalize(generated, "generated")
          committed_normalized = normalize_variable_names(committed_normalized)
          generated_normalized = normalize_variable_names(generated_normalized)
          comparison = [
              f"check_prefix={prefix}",
              f"committed_check_lines={len(committed)}",
              f"generated_check_lines={len(generated)}",
              f"affine_map_check_lines={len(committed_affine)}",
              "affine_map_payloads=PASS",
              "generator_banner=STRIPPED",
              f"placement_adjustments={len(adjustments)}",
          ]
          if committed_normalized != generated_normalized:
              diff = unified_diff(
                  committed_normalized,
                  generated_normalized,
                  fromfile="committed-normalized",
                  tofile="generated-normalized",
                  lineterm="",
              )
              diff_path.write_text("\n".join(diff) + "\n")
              comparison.append("full_check_block=FAIL")
              comparison_path.write_text("\n".join(comparison) + "\n")
              raise SystemExit("complete generated CHECK block differs from committed block")

          diff_path.write_text("")
          comparison.append("full_check_block=PASS")
          comparison.extend(f"placement={item}" for item in adjustments)
          comparison_path.write_text("\n".join(comparison) + "\n")
          PY

            focused_absence_checks=$(grep -Ec "^// ${check_prefix}-NOT:" \
              "$output_path/committed-test.llzk" || true)
            grep -E "^// ${check_prefix}-NOT:" "$output_path/committed-test.llzk" \
              > "$output_path/focused-absence-checks.txt" || true
            committed_checks=$(grep -Ev "^// ${check_prefix}-NOT:" \
              "$output_path/committed-test.llzk" | \
              grep -Ec "^// ${check_prefix}(:|-LABEL:|-NEXT:|-SAME:|-NOT:|-DAG:|-EMPTY:)" || true)
            generated_checks=$(grep -Ec "^// ${check_prefix}(:|-LABEL:|-NEXT:|-SAME:|-NOT:|-DAG:|-EMPTY:)" \
              "$output_path/generated-checks.txt" || true)

            {
              echo "head=$(git -C "$source_root" rev-parse HEAD)"
              echo "check_prefix=$check_prefix"
              echo "test=$test_file"
              echo "producer_command=result/bin/llzk-opt $* $test_file"
              echo "committed_check_lines=$committed_checks"
              echo "fresh_generated_check_lines=$generated_checks"
              echo "focused_absence_checks=$focused_absence_checks"
              echo "focused_absence_oracle=PASS"
              echo "affine_map_payloads=PASS"
              echo "committed_checks_against_exact_head_output=PASS"
              echo "fresh_generated_checks_against_exact_head_output=PASS"
              echo "raw_generated_filecheck=$generated_filecheck_status"
              echo "complete_output_replay=PASS"
            } > "$output_path/replay-metadata.txt"
            rm -f "$clean_input"
            full_check_results+=("$name=PASS")
          }

          replay_focused_test() {
            local name="$1"
            local source_root="$2"
            local test_file="$3"
            local check_prefix="$4"
            local status_contract="$5"
            shift 5
            local filecheck_args=()
            if [[ "$#" -gt 0 && "$1" == "--enable-var-scope" ]]; then
              filecheck_args+=("$1")
              shift
            fi
            local output_path="$OUTPUT_PATH/$name"
            local llzk_opt="$source_root/result/bin/llzk-opt"
            local clean_input="$source_root/${test_file%.llzk}.validation-input.llzk"
            mkdir -p "$output_path"

            cp "$source_root/$test_file" "$output_path/committed-test.llzk"
            python3 - "$source_root/$test_file" "$clean_input" <<'PY'
          from pathlib import Path
          import re
          import sys

          source = Path(sys.argv[1]).read_text()
          output = Path(sys.argv[2])
          check_re = re.compile(
              r"^// [A-Z][A-Z0-9_-]*(?::|-LABEL:|-NEXT:|-SAME:|-NOT:|-DAG:|-EMPTY:)"
          )
          clean = [
              line
              for line in source.splitlines()
              if not line.startswith("// RUN:") and not check_re.match(line)
          ]
          output.write_text("\n".join(clean).strip() + "\n")
          PY
            cp "$clean_input" "$output_path/clean-input.llzk"
            {
              printf 'result/bin/llzk-opt'
              printf ' %q' "$@"
              printf ' %q\n' "$clean_input"
            } > "$output_path/producer-command.txt"

            set +e
            "$llzk_opt" "$@" "$clean_input" > "$output_path/producer-output.txt" 2>&1
            local producer_status=$?
            set -e
            printf 'producer_exit_status=%s\n' "$producer_status" \
              > "$output_path/producer-status.txt"
            case "$status_contract" in
              zero)
                test "$producer_status" -eq 0
                ;;
              nonzero)
                test "$producer_status" -ne 0
                ;;
              pipeline)
                ;;
              *)
                printf 'unknown status contract: %s\n' "$status_contract"
                return 2
                ;;
            esac

            local filecheck_status=N/A
            if [[ "$check_prefix" != NONE ]]; then
              if [[ -z "$filecheck" ]]; then
                filecheck="$(find /nix/store -type f -path '*/bin/FileCheck' -executable -print -quit)"
                test -n "$filecheck"
              fi
              "$filecheck" "${filecheck_args[@]}" --check-prefix="$check_prefix" \
                "$source_root/$test_file" < "$output_path/producer-output.txt" \
                > "$output_path/filecheck.txt" 2>&1
              filecheck_status=PASS
            fi

            {
              echo "head=$(git -C "$source_root" rev-parse HEAD)"
              echo "test=$test_file"
              echo "contract=focused-diagnostic-or-rollback"
              echo "status_contract=$status_contract"
              echo "producer_exit_status=$producer_status"
              echo "filecheck=$filecheck_status"
              echo "result=PASS"
            } > "$output_path/replay-metadata.txt"
            rm -f "$clean_input"
            focused_results+=("$name=PASS")
          }

          prepare_head pr637 "$pr637_head"
          pr637_path="$tested_path"
          replay_pr637_suite() {
            local source_root="$1"
            local name_prefix="$2"
            replay_test "${name_prefix}-expr-deferred-default" "$source_root" \
              test/Transforms/Flattening/instantiate_expr_deferred.llzk \
              DEFAULT --enable-var-scope -llzk-flatten
            replay_test "${name_prefix}-expr-deferred-disabled" "$source_root" \
              test/Transforms/Flattening/instantiate_expr_deferred.llzk \
              DISABLED --enable-var-scope -llzk-flatten=cleanup=disabled
            replay_test "${name_prefix}-expr-felt-typevar" "$source_root" \
              test/Transforms/Flattening/instantiate_expr_felt_typevar_completion.llzk \
              CHECK -split-input-file -llzk-flatten
            replay_test "${name_prefix}-expr-member-type" "$source_root" \
              test/Transforms/Flattening/instantiate_expr_member_type.llzk \
              CHECK -llzk-flatten
            replay_test "${name_prefix}-expr-no-params-default" "$source_root" \
              test/Transforms/Flattening/instantiate_expr_no_params.llzk \
              DEFAULT --enable-var-scope -split-input-file -llzk-flatten
            replay_test "${name_prefix}-expr-no-params-disabled" "$source_root" \
              test/Transforms/Flattening/instantiate_expr_no_params.llzk \
              DISABLED --enable-var-scope -split-input-file -llzk-flatten=cleanup=disabled
            replay_test "${name_prefix}-expr-partial" "$source_root" \
              test/Transforms/Flattening/instantiate_expr_partial.llzk \
              CHECK -split-input-file -llzk-flatten
            replay_test "${name_prefix}-expr-unreferenced" "$source_root" \
              test/Transforms/Flattening/instantiate_expr_unreferenced.llzk \
              CHECK -split-input-file '--pass-pipeline=builtin.module(llzk-flatten{cleanup=disabled})'
            replay_test "${name_prefix}-expr-typevar" "$source_root" \
              test/Transforms/Flattening/instantiate_expr_typevar_completion.llzk \
              CHECK -split-input-file -llzk-flatten
            replay_test "${name_prefix}-funcs-pass" "$source_root" \
              test/Transforms/Flattening/instantiate_funcs_pass.llzk \
              CHECK --enable-var-scope -split-input-file -llzk-flatten -verify-diagnostics
            replay_test "${name_prefix}-nested-call" "$source_root" \
              test/Transforms/Flattening/instantiate_nested_call_template_params.llzk \
              CHECK -llzk-flatten=cleanup=disabled
            replay_test "${name_prefix}-func-rollback" "$source_root" \
              test/Transforms/Flattening/instantiate_func_rollback.llzk \
              CHECK --allow-nonzero --extract-module --merge-stderr \
              --enable-var-scope -llzk-flatten=cleanup=disabled \
              -verify-diagnostics -mlir-print-ir-after-failure
            replay_test "${name_prefix}-struct-pass3" "$source_root" \
              test/Transforms/Flattening/instantiate_structs_pass_3.llzk \
              CHECK --enable-var-scope -split-input-file -llzk-flatten -verify-diagnostics
            replay_test "${name_prefix}-function-order" "$source_root" \
              test/Transforms/Flattening/instantiate_function_order.llzk \
              CHECK -llzk-flatten=cleanup=disabled
            replay_test "${name_prefix}-function-reuse" "$source_root" \
              test/Transforms/Flattening/instantiate_function_reuse.llzk \
              CHECK -llzk-flatten=cleanup=disabled
          }

          replay_pr637_suite "$pr637_path" pr637

          replay_focused_test pr637-expr-deferred-error "$pr637_path" \
            test/Transforms/Flattening/instantiate_expr_deferred_error.llzk \
            NONE nonzero -llzk-flatten -verify-diagnostics
          replay_focused_test pr637-expr-fail "$pr637_path" \
            test/Transforms/Flattening/instantiate_expr_fail.llzk \
            CHECK pipeline --enable-var-scope -split-input-file -llzk-flatten \
            -verify-diagnostics
          replay_focused_test pr637-funcs-fail "$pr637_path" \
            test/Transforms/Flattening/instantiate_funcs_fail.llzk \
            CHECK pipeline --enable-var-scope -split-input-file -llzk-flatten \
            -verify-diagnostics
          replay_focused_test pr637-struct-rollback "$pr637_path" \
            test/Transforms/Flattening/instantiate_struct_rollback.llzk \
            CHECK pipeline --enable-var-scope -split-input-file -llzk-flatten \
            -verify-diagnostics

          if test "${#full_check_results[@]}" -eq 15; then
            full_check_blocks=PASS
          else
            full_check_blocks=FAIL
          fi
          {
            echo "pr637_head=$pr637_head"
            echo "pr637_output_replays=15"
            echo "full_output_replays=15"
            echo "focused_replays=4"
            echo "full_committed_check_blocks=$full_check_blocks"
            echo "full_check_results=${full_check_results[*]}"
            echo "focused_results=${focused_results[*]}"
            if [[ "$full_check_blocks" == PASS && "${#focused_results[@]}" -eq 4 ]]; then
              echo "result=PASS"
            else
              echo "result=FAIL"
            fi
          } > "$OUTPUT_PATH/summary.txt"

          test "${#full_check_results[@]}" -eq 15
          test "${#focused_results[@]}" -eq 4

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: llzk-validation-evidence-${{ github.sha }}
          path: /tmp/llzk-validation-output
          if-no-files-found: error
