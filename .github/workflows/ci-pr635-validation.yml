name: LLZK validation evidence

on:
  push:
    branches:
      - ci/verify-pr635-output-20260810

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    env:
      OUTPUT_PATH: /tmp/llzk-validation-output

    steps:
      - name: Check out validation revision
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@d1ca217b388ee87b2507a9a93bf01368bde7cec2
        with:
          install_url: https://releases.nixos.org/nix/nix-2.23.3/install
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Git credentials
        run: |
          git config --global 'url.https://api@github.com/'.insteadOf 'https://github.com/'
          git config --global 'url.https://ssh@github.com/'.insteadOf 'ssh://git@github.com/'
          git config --global 'url.https://git@github.com/'.insteadOf 'git@github.com:'

      - name: Use project build cache
        uses: cachix/cachix-action@v17
        with:
          name: veridise-public
          skipPush: true

      - name: Generate split transformation checks
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUTPUT_PATH"
          mkdir -p "$OUTPUT_PATH/chunks"

          nix --print-build-logs build --impure --expr \
            'let flake = builtins.getFlake (toString ./.); in flake.packages.x86_64-linux.debugGCC.overrideAttrs (_: { doCheck = false; })'

          llzk_opt="$PWD/result/bin/llzk-opt"
          test_file="test/Transforms/Flattening/instantiate_func_felt_normalization.llzk"
          filecheck="$(find /nix/store -type f -path '*/bin/FileCheck' -executable -print -quit)"
          test -x "$llzk_opt"
          test -n "$filecheck"

          "$llzk_opt" --version > "$OUTPUT_PATH/llzk-opt.version"
          cp "$test_file" "$OUTPUT_PATH/committed-test.llzk"
          python3 - "$test_file" "$OUTPUT_PATH/clean.llzk" <<'PY'
          from pathlib import Path
          import sys

          source = Path(sys.argv[1]).read_text()
          clean = [
              line
              for line in source.splitlines()
              if not line.startswith("// CHECK")
              and not line.startswith("// NOTE: Assertions have been autogenerated")
          ]
          Path(sys.argv[2]).write_text("\n".join(clean).strip() + "\n")
          PY

          "$llzk_opt" -split-input-file -llzk-flatten "$OUTPUT_PATH/clean.llzk" \
            > "$OUTPUT_PATH/producer-output.llzk"
          python3 - "$OUTPUT_PATH/producer-output.llzk" "$OUTPUT_PATH/chunks" <<'PY'
          from pathlib import Path
          import sys

          source = Path(sys.argv[1]).read_text()
          output = Path(sys.argv[2])
          for index, chunk in enumerate(source.split("// -----")):
              (output / f"output-{index:02d}.llzk").write_text(
                  "\n".join(chunk.splitlines()).strip() + "\n"
              )
          PY

          chunk_count=0
          for output_file in "$OUTPUT_PATH"/chunks/output-*.llzk; do
            chunk="$(basename "$output_file" .llzk | sed 's/^output-//')"
            checks_file="$OUTPUT_PATH/chunks/generated-checks-$chunk.txt"
            python3 scripts/generate-test-checks.py < "$output_file" > "$checks_file"
            "$filecheck" "$checks_file" < "$output_file"
            chunk_count=$((chunk_count + 1))
          done
          test "$chunk_count" -eq 4

          {
            echo "head=$(git rev-parse HEAD)"
            echo "test=$test_file"
            echo "producer_command=result/bin/llzk-opt -split-input-file -llzk-flatten $test_file"
            echo "chunk_count=$chunk_count"
            echo "fresh_generated_checks_against_exact_head_output=PASS"
          } > "$OUTPUT_PATH/metadata.txt"

      - name: Upload validation evidence
        uses: actions/upload-artifact@v7
        with:
          name: llzk-validation-evidence-${{ github.sha }}
          path: /tmp/llzk-validation-output
          if-no-files-found: error
