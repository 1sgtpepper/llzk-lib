name: LLZK validation evidence

on:
  push:
    branches:
      - ci/verify-pr635-output-20260810

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-24.04
    env:
      OUTPUT_PATH: /tmp/llzk-validation-output

    steps:
      - name: Check out validation workflow
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@d1ca217b388ee87b2507a9a93bf01368bde7cec2
        with:
          install_url: https://releases.nixos.org/nix/nix-2.23.3/install
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Git credentials
        run: |
          git config --global 'url.https://api@github.com/'.insteadOf 'https://github.com/'
          git config --global 'url.https://ssh@github.com/'.insteadOf 'ssh://git@github.com/'
          git config --global 'url.https://git@github.com/'.insteadOf 'git@github.com:'

      - name: Use project build cache
        uses: cachix/cachix-action@v17
        with:
          name: veridise-public
          skipPush: true

      - name: Replay exact PR-head transformation checks
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUTPUT_PATH"
          mkdir -p "$OUTPUT_PATH"

          pr635_head=1fcf2b3eda365309182fba69c30c35865fdfab4b
          pr637_head=7db8ec92e65d401fdacf8251a38371dd25a2b193
          filecheck=
          full_check_mismatches=()

          prepare_head() {
            local name="$1"
            local head="$2"
            tested_path="$RUNNER_TEMP/llzk-$name"
            git fetch --no-tags --filter=blob:none https://github.com/1sgtpepper/llzk-lib.git "$head"
            git worktree add --detach "$tested_path" "$head"
            test "$(git -C "$tested_path" rev-parse HEAD)" = "$head"
            (
              cd "$tested_path"
              nix --print-build-logs build --impure --expr \
                'let flake = builtins.getFlake (toString ./.); in flake.packages.x86_64-linux.debugGCC.overrideAttrs (_: { doCheck = false; })'
            )
            test -x "$tested_path/result/bin/llzk-opt"
          }

          replay_split() {
            local name="$1"
            local source_root="$2"
            local test_file="$3"
            shift 3
            local chunk_dir="$RUNNER_TEMP/llzk-$name-chunks"
            local output_path="$OUTPUT_PATH/$name"
            local llzk_opt="$source_root/result/bin/llzk-opt"
            mkdir -p "$chunk_dir" "$output_path"
            if [[ -z "$filecheck" ]]; then
              filecheck="$(find /nix/store -type f -path '*/bin/FileCheck' -executable -print -quit)"
              test -n "$filecheck"
            fi

            cp "$source_root/$test_file" "$output_path/committed-test.llzk"
            python3 - "$source_root/$test_file" "$chunk_dir" <<'PY'
          from pathlib import Path
          import sys

          source = Path(sys.argv[1]).read_text()
          output = Path(sys.argv[2])
          for index, chunk in enumerate(source.split("// -----")):
              (output / f"committed-{index:02d}.llzk").write_text(
                  "\n".join(chunk.splitlines()).strip() + "\n"
              )
          clean = [
              line
              for line in source.splitlines()
              if not line.startswith("// CHECK")
              and not line.startswith("// NOTE: Assertions have been autogenerated")
          ]
          (output / "clean.llzk").write_text("\n".join(clean).strip() + "\n")
          PY

            "$llzk_opt" "$@" "$chunk_dir/clean.llzk" > "$output_path/producer-output.llzk" 2>&1
            python3 - "$output_path/producer-output.llzk" "$chunk_dir" <<'PY'
          from pathlib import Path
          import sys

          source = Path(sys.argv[1]).read_text()
          output = Path(sys.argv[2])
          for index, chunk in enumerate(source.split("// -----")):
              (output / f"output-{index:02d}.llzk").write_text(
                  "\n".join(chunk.splitlines()).strip() + "\n"
              )
          PY

            local source_count
            local output_count=0
            local committed_checks=0
            local generated_checks=0
            source_count=$(find "$chunk_dir" -maxdepth 1 -name 'committed-*.llzk' | wc -l)
            for output_file in "$chunk_dir"/output-*.llzk; do
              local chunk
              local committed_file
              local checks_file
              local committed_chunk_checks
              local generated_chunk_checks
              chunk="$(basename "$output_file" .llzk | sed 's/^output-//')"
              committed_file="$chunk_dir/committed-$chunk.llzk"
              checks_file="$output_path/generated-checks-$chunk.txt"
              test -f "$committed_file"
              cp "$committed_file" "$output_path/committed-test-$chunk.llzk"
              python3 "$source_root/scripts/generate-test-checks.py" \
                < "$output_file" > "$checks_file"
              "$filecheck" "$committed_file" < "$output_file"
              "$filecheck" "$checks_file" < "$output_file"
              grep '^// CHECK' "$committed_file" \
                > "$output_path/committed-checks-$chunk.txt"
              grep '^// CHECK' "$checks_file" \
                > "$output_path/generated-checks-only-$chunk.txt"
              if diff -u "$output_path/committed-checks-$chunk.txt" \
                  "$output_path/generated-checks-only-$chunk.txt" \
                  > "$output_path/check-comparison-$chunk.diff"; then
                full_check_block=PASS
              else
                full_check_block=FAIL
                full_check_mismatches+=("$test_file split $chunk")
              fi
              committed_chunk_checks=$(grep -Ec '^// CHECK(:|-LABEL:|-NEXT:)' "$committed_file" || true)
              generated_chunk_checks=$(grep -Ec '^// CHECK(:|-LABEL:|-NEXT:)' "$checks_file" || true)
              committed_checks=$((committed_checks + committed_chunk_checks))
              generated_checks=$((generated_checks + generated_chunk_checks))
              output_count=$((output_count + 1))
            done
            test "$output_count" -eq "$source_count"
            test "$committed_checks" -eq "$generated_checks"

            {
              echo "head=$(git -C "$source_root" rev-parse HEAD)"
              echo "test=$test_file"
              echo "producer_command=result/bin/llzk-opt $* $test_file"
              echo "split_boundary=// -----"
              echo "chunk_count=$output_count"
              echo "committed_check_lines=$committed_checks"
              echo "fresh_generated_check_lines=$generated_checks"
              echo "committed_checks_against_exact_head_output=PASS"
              echo "fresh_generated_checks_against_exact_head_output=PASS"
              echo "full_committed_check_block=$full_check_block"
              echo "complete_check_line_count=PASS"
            } > "$output_path/comparison.txt"
          }

          prepare_head pr635 "$pr635_head"
          pr635_path="$tested_path"
          replay_split pr635-expr-felt-typevar "$pr635_path" \
            test/Transforms/Flattening/instantiate_expr_felt_typevar_completion.llzk \
            -split-input-file -llzk-flatten
          replay_split pr635-expr-partial "$pr635_path" \
            test/Transforms/Flattening/instantiate_expr_partial.llzk \
            -split-input-file -llzk-flatten
          replay_split pr635-expr-target-local "$pr635_path" \
            test/Transforms/Flattening/instantiate_expr_target_local.llzk \
            -split-input-file '--pass-pipeline=builtin.module(llzk-flatten{cleanup=disabled})'
          replay_split pr635-expr-typevar "$pr635_path" \
            test/Transforms/Flattening/instantiate_expr_typevar_completion.llzk \
            -split-input-file -llzk-flatten
          replay_split pr635-felt-normalization "$pr635_path" \
            test/Transforms/Flattening/instantiate_func_felt_normalization.llzk \
            -split-input-file -llzk-flatten
          replay_split pr635-struct-pass3 "$pr635_path" \
            test/Transforms/Flattening/instantiate_structs_pass_3.llzk \
            -split-input-file -llzk-flatten -verify-diagnostics

          prepare_head pr637 "$pr637_head"
          pr637_path="$tested_path"
          replay_split pr637-function-order "$pr637_path" \
            test/Transforms/Flattening/instantiate_function_order.llzk \
            -split-input-file -llzk-flatten=cleanup=disabled
          replay_split pr637-function-reuse "$pr637_path" \
            test/Transforms/Flattening/instantiate_function_reuse.llzk \
            -split-input-file -llzk-flatten=cleanup=disabled

          if test "${#full_check_mismatches[@]}" -eq 0; then
            full_check_blocks=PASS
          else
            full_check_blocks=FAIL
          fi
          {
            echo "pr635_head=$pr635_head"
            echo "pr637_head=$pr637_head"
            echo "full_output_replays=8"
            echo "full_committed_check_blocks=$full_check_blocks"
            echo "full_check_block_mismatches=${full_check_mismatches[*]}"
            echo "result=$full_check_blocks"
          } > "$OUTPUT_PATH/summary.txt"

          test "${#full_check_mismatches[@]}" -eq 0

      - name: Upload validation evidence
        uses: actions/upload-artifact@v7
        with:
          name: llzk-validation-evidence-${{ github.sha }}
          path: /tmp/llzk-validation-output
          if-no-files-found: error
