name: Reproduce issue 300 control-flow gaps

on:
  push:
    branches:
      - repro/issue-300-control-flow-gaps
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    env:
      TARGET_HEAD: b7e9fae301040df771c669b7d7515fc0e5921b39
      EVIDENCE_PATH: /home/runner/work/_temp/issue-300-control-flow-gaps

    steps:
      - name: Check out reproduction branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@d1ca217b388ee87b2507a9a93bf01368bde7cec2
        with:
          install_url: https://releases.nixos.org/nix/nix-2.23.3/install
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Git credentials
        run: |
          git config --global 'url.https://api@github.com/'.insteadOf 'https://github.com/'
          git config --global 'url.https://ssh@github.com/'.insteadOf 'ssh://git@github.com/'
          git config --global 'url.https://git@github.com/'.insteadOf 'git@github.com:'

      - name: Use project build cache
        uses: cachix/cachix-action@v17
        with:
          name: veridise-public
          skipPush: true

      - name: Build and run the exact reproduction branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_PATH"

          test "$(git merge-base HEAD "$TARGET_HEAD")" = "$TARGET_HEAD"
          git diff --exit-code "$TARGET_HEAD" -- \
            include lib tools backends CMakeLists.txt flake.nix flake.lock \
            > "$EVIDENCE_PATH/production-input.diff"
          git diff --name-status "$TARGET_HEAD" > "$EVIDENCE_PATH/reproduction-delta.txt"
          git diff --name-only "$TARGET_HEAD" | sort > "$EVIDENCE_PATH/reproduction-paths.txt"
          diff -u reproducers/issue-300/expected-delta.txt \
            "$EVIDENCE_PATH/reproduction-paths.txt" \
            > "$EVIDENCE_PATH/reproduction-paths.diff"

          nix --print-build-logs build .#debugGCC 2>&1 | tee "$EVIDENCE_PATH/build.log"

          llzk_opt="$PWD/result/bin/llzk-opt"
          filecheck=$(find /nix/store -type f -path '*/bin/FileCheck' -executable -print -quit)
          test -x "$llzk_opt"
          test -n "$filecheck"

          input="$PWD/reproducers/issue-300/control-flow-gaps.llzk"
          "$llzk_opt" -split-input-file --llzk-fuse-product-control-flow "$input" \
            > "$EVIDENCE_PATH/current-output.llzk" 2> "$EVIDENCE_PATH/current-stderr.txt"
          python3 scripts/generate-test-checks.py < "$EVIDENCE_PATH/current-output.llzk" \
            > "$EVIDENCE_PATH/generated-current-checks.txt"
          sed '${/^$/d;}' "$EVIDENCE_PATH/generated-current-checks.txt" \
            > "$EVIDENCE_PATH/generated-current-checks.normalized.txt"

          full_check="$PWD/reproducers/issue-300/current-output.full-check.llzk"
          intended_check="$PWD/reproducers/issue-300/intended-behavior.check"
          "$filecheck" "$full_check" < "$EVIDENCE_PATH/current-output.llzk" \
            > "$EVIDENCE_PATH/current-output.filecheck.stdout.txt" \
            2> "$EVIDENCE_PATH/current-output.filecheck.stderr.txt"
          diff -u "$full_check" "$EVIDENCE_PATH/generated-current-checks.normalized.txt" \
            > "$EVIDENCE_PATH/generated-current-checks.diff"

          for prefix in EQUIVALENT RESULTFUL COMBINED; do
            diagnostic="$EVIDENCE_PATH/${prefix,,}-intended-gap.txt"
            if "$filecheck" --check-prefix="$prefix" "$intended_check" \
                < "$EVIDENCE_PATH/current-output.llzk" > "$diagnostic" 2>&1; then
              printf '%s intended fusion unexpectedly passed at the frozen head\n' "$prefix" >&2
              exit 1
            fi
            grep -F "error: $prefix: expected string not found in input" "$diagnostic"
          done

          probe_result=$(grep -E \
            'LLZKTest\.ComparisonPredicateIsMissingFromSignalIdentity .* Passed' \
            "$EVIDENCE_PATH/build.log" | tail -n 1)
          suite_result=$(grep -E \
            '100% tests passed, 0 tests failed out of [0-9]+' \
            "$EVIDENCE_PATH/build.log" | tail -n 1)
          test -n "$probe_result"
          test -n "$suite_result"
          test -s "$EVIDENCE_PATH/current-output.llzk"
          test -s "$EVIDENCE_PATH/generated-current-checks.txt"
          test -s "$EVIDENCE_PATH/generated-current-checks.normalized.txt"
          test ! -s "$EVIDENCE_PATH/current-stderr.txt"
          test ! -s "$EVIDENCE_PATH/production-input.diff"
          test ! -s "$EVIDENCE_PATH/reproduction-paths.diff"
          test ! -s "$EVIDENCE_PATH/generated-current-checks.diff"

          {
            printf 'production_head=%s\n' "$TARGET_HEAD"
            printf 'reproduction_head=%s\n' "$(git rev-parse HEAD)"
            printf 'production_inputs_unchanged=PASS\n'
            printf 'reproduction_delta_allowlist=PASS\n'
            printf 'full_nix_build_and_test=PASS\n'
            printf 'analysis_predicate_identity_probe=PASS\n'
            printf 'complete_generated_output=PASS\n'
            printf 'exact_ssa_resultless_baseline=FUSED\n'
            printf 'equivalent_distinct_condition_gap=REPRODUCED\n'
            printf 'matching_resultful_constrain_gap=REPRODUCED\n'
            printf 'combined_gap=REPRODUCED\n'
            printf 'different_predicate_control=RETAINED\n'
            printf 'different_operand_control=RETAINED\n'
            printf 'different_result_type_control=RETAINED\n'
            printf 'compiler_stderr=EMPTY\n'
            printf 'analysis_probe_ctest=%s\n' "$probe_result"
            printf 'complete_ctest_suite=%s\n' "$suite_result"
          } > "$EVIDENCE_PATH/summary.txt"

          cp "$input" "$EVIDENCE_PATH/control-flow-gaps.llzk"
          cp "$full_check" "$EVIDENCE_PATH/current-output.full-check.llzk"
          cp "$intended_check" "$EVIDENCE_PATH/intended-behavior.check"
          cp "$PWD/reproducers/issue-300/README.md" "$EVIDENCE_PATH/README.md"
          cp result/artifacts/gcc-report.xml "$EVIDENCE_PATH/gcc-report.xml"
          git rev-parse HEAD > "$EVIDENCE_PATH/reproduction-head.txt"
          printf '%s\n' "$TARGET_HEAD" > "$EVIDENCE_PATH/production-head.txt"
          "$llzk_opt" --version > "$EVIDENCE_PATH/llzk-opt.version.txt"
          printf '%s\n' "$filecheck" > "$EVIDENCE_PATH/filecheck-path.txt"

      - name: Upload reproduction evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: issue-300-control-flow-gaps-${{ github.sha }}
          path: /home/runner/work/_temp/issue-300-control-flow-gaps
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
