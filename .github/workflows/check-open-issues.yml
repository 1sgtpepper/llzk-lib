name: Check issue 700 probe on origin/main
on:
  push:
    branches:
      - test/check-issue-700-20261127

permissions:
  contents: read

jobs:
  check-700:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact upstream main identity
        run: |
          set -euo pipefail
          TARGET=ac453de8131fa908031e37dc958919541d0a2865
          git diff --exit-code "$TARGET" -- include lib tools backends CMakeLists.txt nix flake.nix flake.lock scripts
          test "$(git merge-base HEAD "$TARGET")" = "$TARGET"
          echo "Verified upstream main SHA: $TARGET"
      - uses: cachix/install-nix-action@v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.35.2/install
          github_access_token: "${{ secrets.GITHUB_TOKEN }}"
      - name: Set Git credentials
        run: |
          git config --global 'url.https://api@github.com/'.insteadOf 'https://github.com/'
          git config --global 'url.https://ssh@github.com/'.insteadOf 'ssh://git@github.com/'
          git config --global 'url.https://git@github.com/'.insteadOf 'git@github.com:'
      - uses: cachix/cachix-action@v17
        with:
          name: veridise-public
          skipPush: true
      - name: Build and run LLZK_Analysis_Tests directly
        run: |
          set -euo pipefail
          nix develop .#debugGCC --command bash -c '
            set -euo pipefail
            cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DLLZK_BUILD_DEVTOOLS=ON \
              -DLLZK_VERSION_OVERRIDE="${version:-3.0.0}"
            cmake --build build --target LLZK_Analysis_Tests
            test_bin=$(find build -type f -name LLZK_Analysis_Tests -executable -print -quit)
            test -x "$test_bin"
            "$test_bin" --gtest_filter=*Issue700*
          '
