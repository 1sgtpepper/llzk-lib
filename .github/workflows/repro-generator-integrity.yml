name: Reproduce in-place generator integrity failures

on:
  push:
    branches:
      - audit/contributor-tooling-one-job-repros-20260815

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Reproduce all three source-integrity failures
        shell: bash
        run: |
          set -euo pipefail
          script="$GITHUB_WORKSPACE/scripts/generate-test-checks.py"
          root="$RUNNER_TEMP/generator-integrity"
          rm -rf "$root"
          mkdir -p "$root"

          # Case 1: substring matching deletes legitimate source text.
          mkdir -p "$root/prefix"
          printf '%s\n' \
            'module {' \
            '  func.func @CHECK() {' \
            '  }' \
            '}' > "$root/prefix/source.mlir"
          printf '%s\n' 'module {' '}' > "$root/prefix/input.mlir"
          python3 "$script" \
            --source "$root/prefix/source.mlir" \
            --source_delim_regex='^module ' -i "$root/prefix/input.mlir"
          if grep -Fq 'func.func @CHECK' "$root/prefix/source.mlir"; then
            echo 'NOT REPRODUCED: legitimate CHECK-containing source survived.'
            exit 1
          fi
          echo 'REPRODUCED: source text containing CHECK was deleted.'

          # Case 2: the multiline note comparison is not idempotent.
          mkdir -p "$root/repeat"
          printf '%s\n' \
            'module {' \
            '  func.func @main() {' \
            '  }' \
            '}' > "$root/repeat/source.mlir"
          printf '%s\n' 'module {' '}' > "$root/repeat/input.mlir"
          python3 "$script" \
            --source "$root/repeat/source.mlir" \
            --source_delim_regex='^module ' -i "$root/repeat/input.mlir"
          python3 "$script" \
            --source "$root/repeat/source.mlir" \
            --source_delim_regex='^module ' -i "$root/repeat/input.mlir"
          note_count=$(grep -cF 'NOTE: Assertions have been autogenerated' "$root/repeat/source.mlir" || true)
          if [[ "$note_count" -le 1 ]]; then
            echo "NOT REPRODUCED: repeated generation left $note_count note marker(s)."
            exit 1
          fi
          echo "REPRODUCED: repeated generation left $note_count autogenerated note markers."

          # Case 3: opening the destination before generation completes truncates it.
          mkdir -p "$root/failure"
          printf '%s\n' \
            'module {' \
            '  func.func @main() {' \
            '    %0 = "test.op"() : () -> i32' \
            '    %1 = "test.op"() : () -> i32' \
            '  }' \
            '}' > "$root/failure/source.mlir"
          cp "$root/failure/source.mlir" "$root/failure/source.before.mlir"
          printf '%s\n' \
            'module {' \
            '  func.func @main() {' \
            '    %0 = "test.op"() : () -> i32' \
            '    %1 = "test.op"() : () -> i32' \
            '  }' \
            '}' > "$root/failure/input.mlir"
          set +e
          python3 "$script" \
            --source "$root/failure/source.mlir" \
            --source_delim_regex='^module ' \
            --variable_names='X,X' -i "$root/failure/input.mlir" \
            > "$root/failure/stdout.log" 2> "$root/failure/stderr.log"
          generator_status=$?
          set -e
          cat "$root/failure/stderr.log"
          if [[ "$generator_status" -eq 0 ]] || \
             ! grep -Fq 'duplicate variable name' "$root/failure/stderr.log"; then
            echo 'UNEXPECTED: the controlled generation failure did not occur.'
            exit 1
          fi
          if cmp -s "$root/failure/source.before.mlir" "$root/failure/source.mlir"; then
            echo 'NOT REPRODUCED: the failed generation preserved the source.'
            exit 1
          fi
          echo "REPRODUCED: generation status=$generator_status changed the source before returning nonzero."

          {
            echo '## Reproduction: in-place generator integrity'
            echo '- A source identifier containing CHECK was deleted.'
            echo '- A successful second run duplicated the autogenerated note.'
            echo '- A controlled generation error changed the source before returning nonzero.'
            echo '- Root cause isolated to broad line filtering, non-matching note removal, and early destination truncation in one in-place update path.'
          } >> "$GITHUB_STEP_SUMMARY"
