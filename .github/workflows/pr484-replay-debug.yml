name: LLZK PR 484 replay debug

on:
  push:
    branches:
      - ci/pr484-replay-all-20260825-fdb6488e8

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out validation branch
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@d1ca217b388ee87b2507a9a93bf01368bde7cec2
        with:
          install_url: https://releases.nixos.org/nix/nix-2.23.3/install
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Git credentials
        run: |
          git config --global 'url.https://api@github.com/'.insteadOf 'https://github.com/'
          git config --global 'url.https://ssh@github.com/'.insteadOf 'ssh://git@github.com/'
          git config --global 'url.https://git@github.com/'.insteadOf 'git@github.com:'

      - uses: cachix/cachix-action@v17
        with:
          name: veridise-public
          skipPush: true

      - name: Replay transformed modules
        shell: bash
        run: |
          set -u -o pipefail
          output_root="$RUNNER_TEMP/pr484-replay"
          mkdir -p "$output_root"
          nix build --impure --print-build-logs --expr \
            'let flake = builtins.getFlake (toString ./.) ; in flake.packages.x86_64-linux.debugGCC.overrideAttrs (_: { doCheck = false; })'

          llzk_opt="$GITHUB_WORKSPACE/result/bin/llzk-opt"
          filecheck=$(find /nix/store -type f -path '*/bin/FileCheck' -executable -print -quit)
          test -x "$llzk_opt"
          test -n "$filecheck"

          test_files=(
            test/Transforms/FuseProductControlFlow/fuse_if_positive.llzk
            test/Transforms/FuseProductControlFlow/fuse_if_preserves_locations.llzk
            test/Transforms/FuseProductControlFlow/fuse_if_compute_constrain.llzk
            test/Transforms/FuseProductControlFlow/no_fuse_if_internal_unknown_effect_in_product.llzk
            test/Transforms/FuseProductControlFlow/no_fuse_single.llzk
            test/Transforms/FuseProductControlFlow/fuse_outer.llzk
            test/Transforms/FuseProductControlFlow/fuse_single.llzk
            test/Transforms/FuseProductControlFlow/fuse_with_compute_suffix.llzk
          )
          : > "$output_root/summary.txt"
          for test_file in "${test_files[@]}"; do
            name=$(basename "$test_file" .llzk)
            evidence="$output_root/$name"
            clean_input="$RUNNER_TEMP/$name.llzk"
            mkdir -p "$evidence"
            cp "$GITHUB_WORKSPACE/$test_file" "$evidence/committed-test.llzk"
            python3 - "$GITHUB_WORKSPACE/$test_file" "$clean_input" <<'PY'
          from pathlib import Path
          import sys

          source = Path(sys.argv[1]).read_text()
          lines = [
              line
              for line in source.splitlines()
              if not line.startswith("// CHECK")
              and not line.startswith("// NOTE: Assertions have been autogenerated")
          ]
          Path(sys.argv[2]).write_text("\n".join(lines).strip() + "\n")
          PY
            run_line=$(sed -n '1p' "$GITHUB_WORKSPACE/$test_file")
            pipeline=${run_line#*llzk-opt }
            pipeline=${pipeline%% %s*}
            pipeline=${pipeline//\"/}
            read -r -a producer_args <<< "$pipeline"
            printf 'result/bin/llzk-opt %s %s\n' "$pipeline" "$clean_input" \
              > "$evidence/producer-command.txt"
            if "$llzk_opt" "${producer_args[@]}" "$clean_input" \
                > "$evidence/producer-output.llzk" 2>&1; then
              producer=PASS
            else
              producer=FAIL
            fi
            python3 "$GITHUB_WORKSPACE/scripts/generate-test-checks.py" \
              < "$evidence/producer-output.llzk" > "$evidence/generated-checks.txt"
            if "$filecheck" --enable-var-scope "$GITHUB_WORKSPACE/$test_file" \
                < "$evidence/producer-output.llzk" \
                > "$evidence/filecheck-output.txt" 2>&1; then
              filecheck_result=PASS
            else
              filecheck_result=FAIL
            fi
            printf 'test=%s\nproducer=%s\nfilecheck=%s\n' \
              "$test_file" "$producer" "$filecheck_result" \
              > "$evidence/comparison.txt"
            printf '%s producer=%s filecheck=%s\n' \
              "$test_file" "$producer" "$filecheck_result" >> "$output_root/summary.txt"
          done

      - name: Upload replay outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr484-replay-debug-${{ github.sha }}
          path: /home/runner/work/_temp/pr484-replay
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
