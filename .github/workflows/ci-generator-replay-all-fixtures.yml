name: LLZK PR 484 current-head output replay

on:
  push:
    branches:
      - ci/verify-pr484-current-output-20260823
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-24.04
    env:
      BASE_HEAD: d2c8ece96581416010972c778e75866903bc9568
      TARGET_HEAD: 9e9eb3f18237aec6bc15bdfa18faedf95c33c1b7
      OUTPUT_PATH: /home/runner/work/_temp/llzk-pr484-exact-head

    steps:
      - name: Check out validation workflow
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@d1ca217b388ee87b2507a9a93bf01368bde7cec2
        with:
          install_url: https://releases.nixos.org/nix/nix-2.23.3/install
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Git credentials
        run: |
          git config --global 'url.https://api@github.com/'.insteadOf 'https://github.com/'
          git config --global 'url.https://ssh@github.com/'.insteadOf 'ssh://git@github.com/'
          git config --global 'url.https://git@github.com/'.insteadOf 'git@github.com:'

      - name: Use project build cache
        uses: cachix/cachix-action@v17
        with:
          name: veridise-public
          skipPush: true

      - name: Replay complete generated output
        shell: bash
        run: |
          set -euo pipefail
          tested_path="$RUNNER_TEMP/llzk-pr484-target"
          mkdir -p "$OUTPUT_PATH"

          git fetch --no-tags --filter=blob:none \
            https://github.com/project-llzk/llzk-lib.git "$BASE_HEAD"
          git fetch --no-tags --filter=blob:none \
            https://github.com/1sgtpepper/llzk-lib.git "$TARGET_HEAD"
          git worktree add --detach "$tested_path" "$TARGET_HEAD"
          test "$(git -C "$tested_path" rev-parse HEAD)" = "$TARGET_HEAD"

          (
            cd "$tested_path"
            nix build --impure --print-build-logs --expr \
              'let flake = builtins.getFlake (toString ./.) ; in flake.packages.x86_64-linux.debugGCC.overrideAttrs (_: { doCheck = false; })'
          )

          llzk_opt="$tested_path/result/bin/llzk-opt"
          filecheck=$(find /nix/store -type f -path '*/bin/FileCheck' -executable -print -quit)
          test -x "$llzk_opt"
          test -n "$filecheck"
          "$llzk_opt" --version > "$OUTPUT_PATH/llzk-opt.version"
          printf '%s\n' "$BASE_HEAD" > "$OUTPUT_PATH/base-head.txt"
          printf '%s\n' "$TARGET_HEAD" > "$OUTPUT_PATH/target-head.txt"

          test_files=(
            test/Transforms/FuseProductControlFlow/fuse_if_positive.llzk
            test/Transforms/FuseProductControlFlow/fuse_if_preserves_locations.llzk
            test/Transforms/FuseProductControlFlow/fuse_if_compute_constrain.llzk
            test/Transforms/FuseProductControlFlow/fuse_outer.llzk
            test/Transforms/FuseProductControlFlow/fuse_outer_inner.llzk
            test/Transforms/FuseProductControlFlow/fuse_single.llzk
            test/Transforms/FuseProductControlFlow/fuse_with_compute_suffix.llzk
            test/Transforms/FuseProductControlFlow/no_fuse_if_internal_unknown_effect_in_product.llzk
            test/Transforms/FuseProductControlFlow/no_fuse_inner.llzk
            test/Transforms/FuseProductControlFlow/no_fuse_region_mismatch.llzk
            test/Transforms/FuseProductControlFlow/no_fuse_single.llzk
            test/Transforms/FuseProductControlFlow/shared_dynamic_loop_effects.llzk
          )
          full_check_mismatches=()
          line_count_mismatches=()
          filecheck_mismatches=()

          for test_file in "${test_files[@]}"; do
            name=$(basename "$test_file" .llzk)
            evidence_path="$OUTPUT_PATH/$name"
            clean_input="$RUNNER_TEMP/$name/$name.llzk"
            mkdir -p "$evidence_path" "$(dirname "$clean_input")"
            cp "$tested_path/$test_file" "$evidence_path/committed-test.llzk"

            python3 - "$tested_path/$test_file" "$clean_input" <<'PY'
          from pathlib import Path
          import sys

          source = Path(sys.argv[1]).read_text()
          lines = [
              line
              for line in source.splitlines()
              if not line.startswith("// CHECK")
              and not line.startswith("// NOTE: Assertions have been autogenerated")
          ]
          Path(sys.argv[2]).write_text("\n".join(lines).strip() + "\n")
          PY

            run_line=$(sed -n '1p' "$tested_path/$test_file")
            pipeline=${run_line#*llzk-opt }
            pipeline=${pipeline%% %s*}
            pipeline=${pipeline//\"/}
            read -r -a producer_args <<< "$pipeline"
            producer_input="$evidence_path/$name.llzk"
            cp "$clean_input" "$producer_input"

            printf 'result/bin/llzk-opt %s %s\n' "$pipeline" "$producer_input" \
              > "$evidence_path/producer-command.txt"
            printf 'python3 %s < %s\n' \
              "$tested_path/scripts/generate-test-checks.py" \
              "$evidence_path/producer-output.llzk" \
              > "$evidence_path/generator-command.txt"

            "$llzk_opt" "${producer_args[@]}" "$producer_input" \
              > "$evidence_path/producer-output.llzk" 2>&1
            python3 "$tested_path/scripts/generate-test-checks.py" \
              < "$evidence_path/producer-output.llzk" \
              > "$evidence_path/generated-checks.txt"

            split_delimiters=$(grep -c '^// -----$' "$clean_input" || true)
            generated_separator_checks=$(grep -c '^// CHECK-NEXT:  // -----$' \
              "$evidence_path/generated-checks.txt" || true)
            test "$generated_separator_checks" -eq "$split_delimiters"

            if "$filecheck" --enable-var-scope "$tested_path/$test_file" \
                < "$evidence_path/producer-output.llzk" \
                > "$evidence_path/filecheck-output.txt" 2>&1; then
              filecheck_result=PASS
            else
              filecheck_result=FAIL
              filecheck_mismatches+=("$test_file")
            fi

            grep '^// CHECK' "$tested_path/$test_file" \
              > "$evidence_path/committed-checks.txt"
            grep '^// CHECK' "$evidence_path/generated-checks.txt" \
              > "$evidence_path/generated-checks-only.txt"
            if python3 - "$evidence_path/committed-checks.txt" \
                "$evidence_path/generated-checks-only.txt" \
                "$evidence_path/check-comparison.diff" \
                "$evidence_path/normalized-check-counts.txt" <<'PY'
          from difflib import unified_diff
          from pathlib import Path
          import re
          import sys

          committed_path = Path(sys.argv[1])
          generated_path = Path(sys.argv[2])
          diff_path = Path(sys.argv[3])
          counts_path = Path(sys.argv[4])

          def normalize(lines):
              normalized = []
              variable_names = {}

              def variable(match):
                  name = match.group(1)
                  if name not in variable_names:
                      variable_names[name] = f"VAR_{len(variable_names)}"
                  return f"[[{variable_names[name]}]]"

              for line in lines:
                  line = line.replace(
                      "// CHECK:  // {{[-][-][-][-][-]}}",
                      "// CHECK-NEXT:  // -----",
                      1,
                  )
                  line = re.sub(
                      r'/home/runner/work/_temp/[^\"]*/([^\"/]+\.llzk)',
                      r'{{.*}}\1',
                      line,
                  )
                  line = re.sub(
                      r'#(?:loc(?:\{\{.*?\}\}|\[\[.*?\]\]|\d+)?|\[\[.*?\]\])(?=\s*=\s*loc\()',
                      '#LOC_DEF',
                      line,
                  )
                  line = re.sub(r'#loc(?:\{\{.*?\}\}|\[\[.*?\]\]|\d+)?', '#LOC_REF', line)
                  line = re.sub(r'#\[\[.*?\]\]', '#LOC_REF', line)
                  line = re.sub(
                      r'^// CHECK(?:-(?:LABEL|NEXT|SAME|NOT|DAG|EMPTY))?:',
                      '// CHECK:',
                      line,
                  )
                  line = re.sub(r'^(// CHECK:) +', r'\1 ', line)
                  line = re.sub(
                      r'\[\[([A-Za-z_][A-Za-z0-9_]*)(?::(.*?))?\]\]',
                      variable,
                      line,
                  )
                  normalized.append(line)
              return normalized

          committed = normalize(committed_path.read_text().splitlines())
          generated = normalize(generated_path.read_text().splitlines())
          committed = [line for line in committed if line != "// CHECK: // -----"]
          generated = [line for line in generated if line != "// CHECK: // -----"]
          counts_path.write_text(
              f"committed={len(committed)}\n"
              f"generated={len(generated)}\n"
          )
          if committed != generated:
              diff_path.write_text(
                  "\n".join(
                      unified_diff(
                          committed,
                          generated,
                          fromfile="committed",
                          tofile="generated",
                          lineterm="",
                      )
                  )
                  + "\n"
              )
              raise SystemExit(1)
          diff_path.write_text("")
          PY
            then
              full_check_block=PASS
            else
              full_check_block=FAIL
              full_check_mismatches+=("$test_file")
            fi

            committed_checks=$(sed -n 's/^committed=//p' \
              "$evidence_path/normalized-check-counts.txt")
            generated_checks=$(sed -n 's/^generated=//p' \
              "$evidence_path/normalized-check-counts.txt")
            if test "$committed_checks" -eq "$generated_checks"; then
              complete_check_line_count=PASS
            else
              complete_check_line_count=FAIL
              line_count_mismatches+=("$test_file")
            fi

            {
              echo "head=$TARGET_HEAD"
              echo "test=$test_file"
              echo "producer_command=$(cat "$evidence_path/producer-command.txt")"
              echo "generator_command=$(cat "$evidence_path/generator-command.txt")"
              echo "committed_check_lines=$committed_checks"
              echo "fresh_generated_check_lines=$generated_checks"
              echo "full_committed_check_block=$full_check_block"
              echo "complete_check_line_count=$complete_check_line_count"
              echo "filecheck=$filecheck_result"
              echo "separator_placement_adjustment=structural_split_delimiter_checks_omitted_from_module_comparison"
              echo "split_delimiters=$split_delimiters"
              echo "generated_separator_checks=$generated_separator_checks"
              echo "comparison_normalization=FileCheck directive placement, stable SSA/attribute names, source paths, and location IDs"
            } > "$evidence_path/comparison.txt"
          done

          if test "${#line_count_mismatches[@]}" -eq 0; then
            complete_check_line_counts=PASS
          else
            complete_check_line_counts=FAIL
          fi
          if test "${#full_check_mismatches[@]}" -eq 0; then
            full_committed_check_blocks=PASS
          else
            full_committed_check_blocks=FAIL
          fi

          {
            echo "base=$BASE_HEAD"
            echo "head=$TARGET_HEAD"
            echo "transform_fixture_count=${#test_files[@]}"
            echo "transform_fixture_files=$(printf '%s,' "${test_files[@]}")"
            echo "transform_complete_check_line_counts=$complete_check_line_counts"
            echo "transform_full_committed_check_blocks=$full_committed_check_blocks"
            echo "transform_full_committed_check_block_mismatches=${full_check_mismatches[*]}"
            echo "transform_filecheck_mismatches=${filecheck_mismatches[*]}"
          } > "$OUTPUT_PATH/summary.txt"

          test "${#line_count_mismatches[@]}" -eq 0
          test "${#full_check_mismatches[@]}" -eq 0
          test "${#filecheck_mismatches[@]}" -eq 0

      - name: Upload replay evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr484-exact-head-replay-${{ github.sha }}
          path: /home/runner/work/_temp/llzk-pr484-exact-head
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
