name: Generate review checks

on:
  push:
    branches:
      - ci/generate-review-checks-634-final
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    env:
      TARGET_HEAD: a83892c3dc6b9fc4f1854e88bac37820ccae40fa
      BASE_HEAD: 0d652966c80f3149aec874cc0572909bf7a61bda
    steps:
      - name: Check out the reviewed head
        uses: actions/checkout@v6
        with:
          repository: 1sgtpepper/llzk-lib
          ref: ${{ env.TARGET_HEAD }}
          fetch-depth: 0
          persist-credentials: false

      - uses: cachix/install-nix-action@d1ca217b388ee87b2507a9a93bf01368bde7cec2
        with:
          install_url: https://releases.nixos.org/nix/nix-2.23.3/install
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Git credentials
        run: |
          git config --global 'url.https://api@github.com/'.insteadOf 'https://github.com/'
          git config --global 'url.https://ssh@github.com/'.insteadOf 'ssh://git@github.com/'
          git config --global 'url.https://git@github.com/'.insteadOf 'git@github.com:'

      - uses: cachix/cachix-action@v17
        with:
          name: veridise-public
          authToken: '${{ secrets.CACHIX_PUBLIC_TOKEN }}'

      - name: Build exact-head tools
        run: |
          nix --print-build-logs build --impure --expr \
            'let flake = builtins.getFlake (toString ./.); in flake.packages.x86_64-linux.debugGCC.overrideAttrs (_: { doCheck = false; })'

      - name: Generate and compare complete check blocks
        shell: bash
        run: |
          set -euo pipefail
          output_root="$RUNNER_TEMP/llzk-pr634-output"
          mkdir -p "$output_root"
          test "$(git rev-parse HEAD)" = "$TARGET_HEAD"
          filecheck="$(find /nix/store -type f -path '*/bin/FileCheck' -executable -print -quit)"
          test -x "$GITHUB_WORKSPACE/result/bin/llzk-opt"
          test -n "$filecheck"

          tests=(
            test/Dialect/Function/call_with_symbolic_felt_restriction_pass.llzk
            test/Dialect/Struct/struct_params_restrictions_pass.llzk
            test/Dialect/Struct/struct_params_symbolic_pass.llzk
            test/Dialect/Verif/include_with_symbolic_felt_restriction_pass.llzk
          )
          printf 'target=%s\n' "$TARGET_HEAD" > "$output_root/summary.txt"
          printf 'base=%s\n' "$BASE_HEAD" >> "$output_root/summary.txt"

          for test_file in "${tests[@]}"; do
            name="$(basename "$test_file" .llzk)"
            test_output="$output_root/$name"
            clean_input="$RUNNER_TEMP/$name-clean.llzk"
            mkdir -p "$test_output"
            cp "$test_file" "$test_output/committed-test.llzk"

            python3 - "$test_file" "$clean_input" <<'PY'
          from pathlib import Path
          import sys

          source = Path(sys.argv[1]).read_text()
          lines = [
              line
              for line in source.splitlines()
              if not line.startswith("// CHECK")
              and not line.startswith("// NOTE: Assertions have been autogenerated")
          ]
          Path(sys.argv[2]).write_text("\n".join(lines).strip() + "\n")
          PY

            run_line="$(sed -n '1p' "$test_file")"
            producer="${run_line#// RUN: }"
            producer="${producer%%| FileCheck*}"
            producer="${producer//%s/$clean_input}"
            printf '%s\n' "$producer" > "$test_output/producer-command.txt"
            PATH="$GITHUB_WORKSPACE/result/bin:$PATH" bash -o pipefail -c "$producer" \
              > "$test_output/producer-output.llzk" \
              2> "$test_output/producer-stderr.txt"

            "$filecheck" "$test_file" < "$test_output/producer-output.llzk" \
              > "$test_output/committed-filecheck.txt" \
              2>&1
            python3 scripts/generate-test-checks.py \
              < "$test_output/producer-output.llzk" \
              > "$test_output/generated-checks.txt"

            python3 - "$test_output/committed-test.llzk" \
                "$test_output/generated-checks.txt" \
                "$test_output/comparison.txt" \
                "$test_output/check-comparison.diff" <<'PY'
          from difflib import unified_diff
          from pathlib import Path
          import sys

          committed_path = Path(sys.argv[1])
          generated_path = Path(sys.argv[2])
          comparison_path = Path(sys.argv[3])
          diff_path = Path(sys.argv[4])

          committed = [
              line for line in committed_path.read_text().splitlines()
              if line.startswith("// CHECK")
          ]
          generated = [
              line for line in generated_path.read_text().splitlines()
              if line.startswith("// CHECK")
          ]
          adjustments = []

          def normalize(lines, source):
              normalized = []
              for line in lines:
                  if line.startswith("// CHECK: #[[$ATTR_") and "affine_map" in line:
                      adjustments.append(f"{source}: affine-map check kept with its defining split")
                      continue
                  if line.startswith("// CHECK:  // -----"):
                      adjustments.append(f"{source}: separator CHECK-NEXT relaxed across blank output line")
                      line = line.replace("// CHECK:  // -----", "// CHECK-NEXT:  // -----", 1)
                  normalized.append(line)
              return normalized

          committed_normalized = normalize(committed, "committed")
          generated_normalized = normalize(generated, "generated")
          comparison = [
              f"committed_check_lines={len(committed)}",
              f"generated_check_lines={len(generated)}",
              "generator_banner=STRIPPED",
              f"placement_adjustments={len(adjustments)}",
          ]
          if committed_normalized != generated_normalized:
              diff = unified_diff(
                  committed_normalized,
                  generated_normalized,
                  fromfile="committed-normalized",
                  tofile="generated-normalized",
                  lineterm="",
              )
              diff_path.write_text("\n".join(diff) + "\n")
              comparison.append("full_check_block=FAIL")
              comparison_path.write_text("\n".join(comparison) + "\n")
              raise SystemExit("complete generated CHECK block differs from committed block")

          diff_path.write_text("")
          comparison.append("full_check_block=PASS")
          comparison.extend(f"placement={item}" for item in adjustments)
          comparison_path.write_text("\n".join(comparison) + "\n")
          PY

            printf '%s\n' "$name=PASS" >> "$output_root/summary.txt"
          done

      - name: Upload generated checks
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: review-checks-634-${{ env.TARGET_HEAD }}
          path: /home/runner/work/_temp/llzk-pr634-output
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
